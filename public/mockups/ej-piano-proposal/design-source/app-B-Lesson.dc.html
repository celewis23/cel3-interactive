<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live online lesson (B)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FF6A4D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 18px 18px 12px; display: flex; align-items: center; justify-content: space-between">
<div>
<div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px">Maya's lesson</div>
<div style="font-size: 13px; color: #BDBDBD">with E&amp;J Studio</div>
</div>
<span style="display: flex; align-items: center; gap: 6px; background: #2A2A2A; border-radius: 0; padding: 6px 12px; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 50%; background: #F26B4F"></span>Live · 18:42</span>
</header>

<main style="flex: 1; padding: 0 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0">
<div style="flex: 1; border-radius: 0; background: #1C1C1C; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0">
<img src="../media/images/teacher-portrait.jpg" alt="Teacher on video" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; border-radius: 0; display: block">
<span style="position: absolute; left: 14px; bottom: 14px; background: rgba(11,20,40,0.75); border-radius: 0; padding: 4px 10px; font-size: 13px">Teacher</span>
<div style="position: absolute; right: 12px; top: 12px; width: 108px; height: 150px; border-radius: 0; background: #3A3A3A; border: 2px solid #000000; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #ECECEC">{{selfLabel}}</div>
</div>

<div style="background: #FFFFFF; color: #0E0E0E; border-radius: 0; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 0; background: #0E0E0E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6A4D" stroke-width="1.8" stroke-linecap="round"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #C2321A">SHARED BY TEACHER</span><span style="display: block; font-weight: 700">Minuet in G · page 2</span></span>
<button type="button" style="font: inherit; font-weight: 700; font-size: 13px; background: transparent; color: #0E0E0E; border: 1.5px solid #0E0E0E; border-radius: 0; padding: 8px 14px; min-height: 40px; cursor: pointer">Open</button>
</div>
</main>

<div style="padding: 16px 18px 30px; display: flex; justify-content: space-between; align-items: center">
<button type="button" onClick="{{toggleMic}}" aria-label="Microphone" aria-pressed="{{micOff}}" style="width: 60px; height: 60px; border-radius: 50%; border: none; background: {{micBg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{micStroke}}" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v4"></path></svg></button>
<button type="button" onClick="{{toggleCam}}" aria-label="Camera" aria-pressed="{{camOff}}" style="width: 60px; height: 60px; border-radius: 50%; border: none; background: {{camBg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{camStroke}}" stroke-width="1.9" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"></rect><path d="M16 10l6-3v10l-6-3"></path></svg></button>
<button type="button" aria-label="Switch to piano camera" style="width: 60px; height: 60px; border-radius: 50%; border: none; background: #2A2A2A; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-4l-2-3h-4L8 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path><path d="M9 13l3-3 3 3M12 10v7"></path></svg></button>
<a href="app-B-Practice.dc.html" aria-label="Leave lesson" style="width: 76px; height: 60px; border-radius: 0; background: #C53A24; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12 9c-4.4 0-8.3 1.6-9.6 3.4-.4.6-.3 1.4.2 1.9l1.7 1.6c.5.5 1.3.5 1.8.1l2-1.5c.4-.3.6-.8.5-1.3l-.3-1.6c2.4-.8 5-.8 7.4 0l-.3 1.6c-.1.5.1 1 .5 1.3l2 1.5c.5.4 1.3.4 1.8-.1l1.7-1.6c.5-.5.6-1.3.2-1.9C20.3 10.6 16.4 9 12 9z"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { micOff: false, camOff: false }; }
  renderVals() {
    var m = this.state.micOff, c = this.state.camOff;
    return {
      micOff: m, camOff: c,
      micBg: m ? '#FFFFFF' : '#2A2A2A', micStroke: m ? '#0E0E0E' : '#FFFFFF',
      camBg: c ? '#FFFFFF' : '#2A2A2A', camStroke: c ? '#0E0E0E' : '#FFFFFF',
      selfLabel: c ? 'Camera off' : '[Maya at piano]',
      toggleMic: () => this.setState({ micOff: !this.state.micOff }),
      toggleCam: () => this.setState({ camOff: !this.state.camOff })
    };
  }
}
</script>
</body>
</html>
