<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Customers</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Customers</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<sc-for list="{{customers}}" as="c" hint-placeholder-count="6">
<a href="{{c.href}}" style="{{theme.card}};display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:inherit">
<span><strong>{{c.name}}</strong><br><span style="font-size:12px;color:{{theme.muted}}">{{c.meta}}</span></span><span aria-hidden="true">→</span>
</a>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var theme = window.JJTheme.current();
var raw = [
['dana','Dana R.','dana@example.com','customer since 2025 · 3 orders · subscription active'],
['marcus','Marcus T.','marcus@example.com','customer since 2025 · 1 order'],
['priya','Priya K.','priya@example.com','customer since 2024 · 6 orders'],
['terrence','Terrence B.','terrence@example.com','customer since 2025 · 1 order'],
['monique','Monique S.','monique@example.com','customer since 2025 · 1 order'],
['alicia','Alicia M.','alicia@example.com','customer since 2025 · 1 order']
];
var customers = raw.map(function (r) { return { id: r[0], name: r[1], email: r[2], meta: r[3],
href: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more/customers/detail?id=' + r[0] }; });
var tabs = window.JJKit.ownerTabs(theme.design, 'more');
return { theme: theme, customers: customers, back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more', tabs: tabs };
}
}
</script>
</body>
</html>
