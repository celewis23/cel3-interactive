<body>

<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Inventory</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<p style="margin:0;font-size:12px;color:{{theme.muted}}">Sample stock levels — not from a real inventory system yet.</p>
<a href="{{batchHref}}" style="{{theme.btnGhost}};text-decoration:none">Batch update</a>
<sc-for list="{{items}}" as="p" hint-placeholder-count="29">
<a href="{{p.href}}" style="{{theme.card}};display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:inherit">
<span><strong>{{p.name}}</strong></span><span style="font-weight:700;color:{{p.color}}">{{p.stock}} left</span>
</a>
</sc-for>
</div>

</div>
</x-dc>
