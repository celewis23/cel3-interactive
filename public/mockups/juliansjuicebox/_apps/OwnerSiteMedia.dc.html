<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Media library</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Media library</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<a href="{{uploadHref}}" style="{{theme.btnCta}};text-decoration:none">Upload a photo</a>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<sc-for list="{{media}}" as="m" hint-placeholder-count="6">
<div style="{{theme.cardFlat}};padding:0;overflow:hidden;display:flex;flex-direction:column">
<div aria-hidden="true" style="height:90px;background:{{m.bg}}"></div>
<div style="padding:8px;display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{m.name}}</span>
<button type="button" onClick="{{m.use}}" style="min-height:36px;border:0;border-radius:6px;background:{{m.useBg}};font:inherit;font-size:12px;font-weight:700;cursor:pointer">{{m.useLabel}}</button>
</div>
</div>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var used = st.usedMedia || {};
var names = ['juice-lineup.jpg', 'kitchen-prep.jpg', 'winter-cleanse-box.jpg', 'storefront.jpg', 'bottling-line.jpg', 'owner-portrait.jpg'];
var media = names.map(function (n, i) {
var on = !!used[n];
return { name: n, bg: theme.avatarColors[i % theme.avatarColors.length], useLabel: on ? 'Used on Home' : 'Use on Home',
useBg: on ? theme.accentSoft : theme.bg, use: function () { var u = Object.assign({}, used); u[n] = !u[n]; self.setState({ usedMedia: u }); } };
});
return { theme: theme, media: media, uploadHref: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/site/upload',
back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/site' };
}
}
</script>
</body>
</html>
