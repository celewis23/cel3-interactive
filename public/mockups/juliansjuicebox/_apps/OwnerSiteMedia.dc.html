<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Media library</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content"><sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>

<a class="jj-app-button jj-primary" href="{{uploadHref}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.cta}};color:{{theme.ctaText}};text-decoration:none">Upload a photo</a>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<sc-for list="{{media}}" as="m" hint-placeholder-count="6">
<div style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px;padding:0;overflow:hidden;display:flex;flex-direction:column">
<div aria-hidden="true" style="height:90px;background:{{m.bg}}"></div>
<div style="padding:8px;display:flex;flex-direction:column;gap:6px">
<span style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{m.name}}</span>
<button class="jj-app-button" type="button" onClick="{{m.use}}" style="min-height:36px;border:0;border-radius:{{theme.radiusSmall}};background:{{m.useBg}};font:inherit;font-size:12px;font-weight:700;cursor:pointer">{{m.useLabel}}</button>
</div>
</div>
</sc-for>
</div>

<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var used = st.usedMedia || {};
var names = ['juice-lineup.jpg', 'kitchen-prep.jpg', 'winter-cleanse-box.jpg', 'storefront.jpg', 'bottling-line.jpg', 'owner-portrait.jpg'];
var media = names.map(function (n, i) {
var on = !!used[n];
return { name: n, bg: theme.avatarColors[i % theme.avatarColors.length], useLabel: on ? 'Used on Home' : 'Use on Home',
useBg: on ? theme.accentSoft : theme.bg, use: function () { var u = Object.assign({}, used); u[n] = !u[n]; self.setState({ usedMedia: u }); } };
});
return { theme: theme, media: media, uploadHref: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/site/upload',
back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/site' };
}
}
</script>
</body>
</html>
