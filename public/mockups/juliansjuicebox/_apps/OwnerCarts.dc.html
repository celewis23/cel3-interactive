<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Abandoned carts</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Abandoned carts</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<p style="margin:0;font-size:12px;color:{{theme.muted}}">Sample data — no real cart-recovery source yet.</p>
<sc-for list="{{carts}}" as="c" hint-placeholder-count="3">
<div style="{{theme.card}};display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between"><strong>{{c.name}}</strong><span>{{c.value}}</span></div>
<p style="margin:0;font-size:13px;color:{{theme.muted}}">{{c.items}} · left {{c.time}}</p>
<button type="button" onClick="{{c.remind}}" style="{{theme.btnGhost}}">{{c.remindLabel}}</button>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var reminded = st.reminded || {};
var raw = [
['c1','Jordan P.','Build A Box · 6 bottles','$42.00','2 hours ago'],
['c2','Casey L.','Winter Juice Cleanse','$149.99','yesterday'],
['c3','Morgan F.','Immunity Booster Shots (30 Pack)','$119.99','2 days ago']
];
var carts = raw.map(function (r) {
var sent = !!reminded[r[0]];
return { id: r[0], name: r[1], items: r[2], value: r[3], time: r[4], remindLabel: sent ? 'Reminder sent' : 'Send reminder',
remind: function () { var m = Object.assign({}, reminded); m[r[0]] = true; self.setState({ reminded: m }); } };
});
return { theme: theme, carts: carts, back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more' };
}
}
</script>
</body>
</html>
