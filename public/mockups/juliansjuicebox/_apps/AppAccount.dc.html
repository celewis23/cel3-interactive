<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Julian's Juicebox — Account</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">

<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="{{theme.card}}">
<p style="margin:0;font-weight:700;font-size:18px">Dana R.</p>
<p style="margin:2px 0 0;color:{{theme.muted}}">dana@example.com</p>
</div>
<a href="{{subHref}}" style="{{theme.card}};display:flex;justify-content:space-between;text-decoration:none;color:inherit"><span>My subscription</span><span>→</span></a>
<a href="{{guideHref}}" style="{{theme.card}};display:flex;justify-content:space-between;text-decoration:none;color:inherit"><span>Cleanse Guide</span><span>→</span></a>
<a href="{{notifHref}}" style="{{theme.card}};display:flex;justify-content:space-between;text-decoration:none;color:inherit"><span>Notifications</span><span>{{notifStatus}}</span></a>
<button type="button" onClick="{{toggleSignIn}}" style="{{theme.btnGhost}}">{{signInLabel}}</button>
</div>
<nav aria-label="App" style="{{theme.tabBar}};grid-template-columns:repeat(4,1fr)">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="4">
<a href="{{tb.href}}" aria-current="{{tb.on}}" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;text-decoration:none;background:{{tb.bg}};color:{{tb.fg}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.d}}"></path></svg>
<span>{{tb.label}}</span>
<sc-if value="{{tb.hasBadge}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position:absolute;top:2px;right:18%;min-width:14px;height:14px;border-radius:7px;background:#e0901a;color:#1c1c1a;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px">{{tb.badge}}</span></sc-if>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var app = window.JJAppState.load(theme.design);
var tabs = window.JJKit.customerTabs(theme.design, 'account', 0);
return { theme: theme, tabs: tabs,
subHref: '/mockups/juliansjuicebox/' + theme.design + '/app/subscription',
guideHref: '/mockups/juliansjuicebox/' + theme.design + '/app/guide',
notifHref: '/mockups/juliansjuicebox/' + theme.design + '/app/notifications-permission',
notifStatus: app.notifPermission === 'granted' ? 'On' : 'Off',
signInLabel: app.signedIn ? 'Sign out' : 'Sign in',
toggleSignIn: function () { if (app.signedIn) { window.JJAppState.save(theme.design, { signedIn: false }); self.setState({ _t: Date.now() }); } else { location.href = '/mockups/juliansjuicebox/' + theme.design + '/app/signin'; } } };
}
}
</script>
</body>
</html>
