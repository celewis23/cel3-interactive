<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Julian's Juicebox — Account</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content"><sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>

<div style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px">
<p style="margin:0;font-weight:700;font-size:18px">Dana R.</p>
<p style="margin:2px 0 0;color:{{theme.muted}}">dana@example.com</p>
</div>
<a href="{{subHref}}" style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px;display:flex;justify-content:space-between;text-decoration:none;color:inherit"><span>My subscription</span><span>→</span></a>
<a href="{{guideHref}}" style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px;display:flex;justify-content:space-between;text-decoration:none;color:inherit"><span>Cleanse Guide</span><span>→</span></a>
<a href="{{notifHref}}" style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px;display:flex;justify-content:space-between;text-decoration:none;color:inherit"><span>Notifications</span><span>{{notifStatus}}</span></a>
<button class="jj-app-button" type="button" onClick="{{toggleSignIn}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.surface}};color:{{theme.ink}};border:{{theme.borderLight}}">{{signInLabel}}</button>

<a class="jj-overview-row" href="{{screenOverview}}">← All designs<span aria-hidden="true">›</span></a>
<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var self = this;
var theme = window.JJTheme.current();
var app = window.JJAppState.load(theme.design);
var tabs = window.JJKit.customerTabs(theme.design, 'account', 0);
return { theme: theme, tabs: tabs,
subHref: '/mockups/juliansjuicebox/' + theme.design + '/app/subscription',
guideHref: '/mockups/juliansjuicebox/' + theme.design + '/app/guide',
notifHref: '/mockups/juliansjuicebox/' + theme.design + '/app/notifications-permission',
notifStatus: app.notifPermission === 'granted' ? 'On' : 'Off',
signInLabel: app.signedIn ? 'Sign out' : 'Sign in',
toggleSignIn: function () { if (app.signedIn) { window.JJAppState.save(theme.design, { signedIn: false }); self.setState({ _t: Date.now() }); } else { location.href = '/mockups/juliansjuicebox/' + theme.design + '/app/signin'; } } };
}
}
</script>
</body>
</html>
