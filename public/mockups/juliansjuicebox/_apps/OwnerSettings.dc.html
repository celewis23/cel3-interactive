<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Store settings</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Store settings</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<label style="font-weight:600;font-size:13px">Business name<input type="text" value="{{name}}" onChange="{{onName}}" style="{{theme.input}};margin-top:6px"></label>
<label style="font-weight:600;font-size:13px">Store hours<input type="text" value="{{hours}}" onChange="{{onHours}}" placeholder="e.g. Mon–Fri 9am–5pm" style="{{theme.input}};margin-top:6px"></label>
<label style="font-weight:600;font-size:13px">Shipping note<input type="text" value="{{shipping}}" onChange="{{onShipping}}" placeholder="e.g. Ships Tue and Fri" style="{{theme.input}};margin-top:6px"></label>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Saved.</p></sc-if>
<button type="button" onClick="{{save}}" style="{{theme.btnPrimary}}">Save</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var app = window.JJAppState.load(theme.design);
var settings = app.storeSettings || { name: "Julian's Juicebox", hours: '', shipping: '' };
return { theme: theme, name: settings.name, hours: settings.hours, shipping: settings.shipping, saved: !!st.saved,
back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more',
onName: function (e) { window.JJAppState.save(theme.design, { storeSettings: Object.assign({}, settings, { name: e.target.value }) }); self.setState({ saved: false }); },
onHours: function (e) { window.JJAppState.save(theme.design, { storeSettings: Object.assign({}, settings, { hours: e.target.value }) }); self.setState({ saved: false }); },
onShipping: function (e) { window.JJAppState.save(theme.design, { storeSettings: Object.assign({}, settings, { shipping: e.target.value }) }); self.setState({ saved: false }); },
save: function () { self.setState({ saved: true }); } };
}
}
</script>
</body>
</html>
