<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Julian's Juicebox — Order detail</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Order detail</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="{{theme.card}}">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><h2 style="margin:0;font-size:21px;{{theme.head}}">{{order.items}}</h2><span>{{order.id}}</span></div>
<p style="margin:0 0 10px;color:{{theme.muted}}">{{order.total}}</p>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;font-weight:700;text-align:center;text-transform:uppercase">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<div><div style="height:8px;border-radius:4px;background:{{s.bg}};margin-bottom:6px"></div>{{s.label}}</div>
</sc-for>
</div>
</div>
<button type="button" onClick="{{reorder}}" style="{{theme.btnPrimary}}">{{reorderLabel}}</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var app = window.JJAppState.load(theme.design);
var id = (new URLSearchParams(location.search)).get('id') || '#2143';
var placed = (app.placedOrders || []).filter(function (o) { return o.id === id; })[0];
var seed = { id: '#2143', items: 'Winter Cleanse', total: '[PRICE]', packedKey: '#2143' };
var order = placed || seed;
var packed = !!app.packedOrders[order.packedKey || order.id];
var stepOn = packed ? 2 : 1;
var steps = ['Ordered', 'Packed', 'Shipped', 'Delivered'].map(function (label, i) {
return { label: label, bg: i < stepOn ? theme.accent : theme.line };
});
return { theme: theme, order: order, steps: steps, back: '/mockups/juliansjuicebox/' + theme.design + '/app/orders',
reorderLabel: st.reordered ? 'Added to your box' : 'Reorder',
reorder: function () { self.setState({ reordered: true }); } };
}
}
</script>
</body>
</html>
