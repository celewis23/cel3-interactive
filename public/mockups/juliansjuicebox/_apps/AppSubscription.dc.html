<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Julian's Juicebox — Subscription</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content"><sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>

<div style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between"><strong>Winter Cleanse</strong><span style="padding:4px 10px;border-radius:{{theme.radiusPill}};font-size:12px;font-weight:700;background:{{statusBg}};color:{{theme.ink}}">{{statusLabel}}</span></div>
<p style="margin:0;color:{{theme.muted}}">Monthly · next box {{nextDate}}</p>
</div>
<sc-if value="{{skipped}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Next box skipped.</p></sc-if>
<div style="display:flex;flex-direction:column;gap:10px">
<button class="jj-app-button" type="button" onClick="{{toggle}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.surface}};color:{{theme.ink}};border:{{theme.borderLight}}">{{toggleLabel}}</button>
<button class="jj-app-button" type="button" onClick="{{skip}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.surface}};color:{{theme.ink}};border:{{theme.borderLight}}">Skip next box</button>
</div>

<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var app = window.JJAppState.load(theme.design);
var sub = app.subscription || { status: 'active', nextDate: 'Dec 9' };
var active = sub.status === 'active';
return { theme: theme, statusLabel: active ? 'Active' : 'Paused', statusBg: active ? theme.accentSoft : theme.gold,
nextDate: sub.nextDate, toggleLabel: active ? 'Pause subscription' : 'Resume subscription', skipped: !!st.skipped,
back: '/mockups/juliansjuicebox/' + theme.design + '/app/account',
toggle: function () { window.JJAppState.save(theme.design, { subscription: Object.assign({}, sub, { status: active ? 'paused' : 'active' }) }); self.setState({ _t: Date.now() }); },
skip: function () { self.setState({ skipped: true }); } };
}
}
</script>
</body>
</html>
