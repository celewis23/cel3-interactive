<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Julian's Juicebox — Notifications</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Notifications</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="{{theme.card}}">
<p style="margin:0 0 8px;font-weight:700">Stay in the loop</p>
<p style="margin:0;color:{{theme.muted}}">Get notified about order updates and app-only bulletins.</p>
</div>
<sc-if value="{{status}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">{{statusMsg}}</p></sc-if>
<div style="display:flex;flex-direction:column;gap:10px">
<button type="button" onClick="{{allow}}" style="{{theme.btnPrimary}}">Allow notifications</button>
<button type="button" onClick="{{dismiss}}" style="{{theme.btnGhost}}">Not now</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var app = window.JJAppState.load(theme.design);
var status = app.notifPermission && app.notifPermission !== 'unset';
return { theme: theme, status: status, statusMsg: app.notifPermission === 'granted' ? 'Notifications are on.' : 'Notifications are off.',
back: '/mockups/juliansjuicebox/' + theme.design + '/app/account',
allow: function () { window.JJAppState.save(theme.design, { notifPermission: 'granted' }); self.setState({ _t: Date.now() }); },
dismiss: function () { window.JJAppState.save(theme.design, { notifPermission: 'dismissed' }); self.setState({ _t: Date.now() }); } };
}
}
</script>
</body>
</html>
