<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Order detail</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Order detail</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="{{theme.card}}">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0;{{theme.head}};font-size:22px">{{order.id}}</h2><span style="padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;background:{{order.statusBg}};color:{{theme.ink}}">{{order.status}}</span></div>
<p style="margin:0 0 4px;font-weight:700">{{order.who}} · {{order.email}}</p>
<p style="margin:0;color:{{theme.muted}}">Ships to {{order.to}}</p>
</div>
<div style="{{theme.card}}">
<h3 style="margin:0 0 8px;font-size:15px">Items</h3>
<p style="margin:0 0 10px">{{order.items}}</p>
<div style="display:flex;justify-content:space-between;border-top:{{theme.borderLight}};padding-top:10px;font-weight:700"><span>Total</span><span>{{order.total}}</span></div>
</div>
<div style="{{theme.card}}">
<h3 style="margin:0 0 8px;font-size:15px">Timeline</h3>
<p style="margin:0 0 4px">Placed · {{order.placedAt}}</p>
<p style="margin:0">{{order.timelineStatus}}</p>
</div>
<sc-if value="{{noteSaved}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Note saved.</p></sc-if>
<sc-if value="{{refunded}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Refund started for {{order.total}}.</p></sc-if>
<sc-if value="{{labelPrinted}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Shipping label sent to the printer.</p></sc-if>
<div style="display:flex;flex-direction:column;gap:10px">
<button type="button" onClick="{{togglePacked}}" style="{{theme.btnPrimary}}">{{packLabel}}</button>
<button type="button" onClick="{{printLabel}}" style="{{theme.btnGhost}}">Print shipping label</button>
<button type="button" onClick="{{refund}}" style="{{theme.btnGhost}}">Refund this order</button>
<button type="button" onClick="{{addNote}}" style="{{theme.btnGhost}}">Add a note</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var app = window.JJAppState.load(theme.design);
var id = (new URLSearchParams(location.search)).get('id') || '#2143';
var raw = [
['#2143','Dana R.','Winter Cleanse','Richmond, VA','[PRICE]','dana@example.com'],
['#2142','Alicia M.','Build A Box · 12 bottles','Atlanta, GA','$84.00','alicia@example.com'],
['#2141','Marcus T.','Immune Boost box','Columbus, OH','[PRICE]','marcus@example.com'],
['#2140','Priya K.','Immunity Shots × 6','Charlotte, NC','[PRICE]','priya@example.com'],
['#2139','Terrence B.','Low Sugar Cleanse','Dallas, TX','[PRICE]','terrence@example.com'],
['#2138','Monique S.','Build A Box · 6 bottles','Baltimore, MD','$42.00','monique@example.com']
];
var match = raw.filter(function (r) { return r[0] === id; })[0] || raw[0];
var packed = !!app.packedOrders[match[0]];
var order = { id: match[0], who: match[1], items: match[2], to: match[3], total: match[4], email: match[5],
status: packed ? 'Packed' : 'To fill', statusBg: theme.gold,
placedAt: 'Nov 12, 9:04 AM', timelineStatus: packed ? 'Packed and ready to ship.' : 'Waiting to be packed.' };
return {
theme: theme, order: order, back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/orders',
packLabel: packed ? 'Undo mark packed' : 'Mark packed',
togglePacked: function () { var p = Object.assign({}, app.packedOrders); p[match[0]] = !p[match[0]]; window.JJAppState.save(theme.design, { packedOrders: p }); self.setState({ _t: Date.now() }); },
printLabel: function () { self.setState({ labelPrinted: true }); },
refund: function () { self.setState({ refunded: true }); },
addNote: function () { self.setState({ noteSaved: true }); },
noteSaved: !!st.noteSaved, refunded: !!st.refunded, labelPrinted: !!st.labelPrinted,
};
}
}
</script>
</body>
</html>
