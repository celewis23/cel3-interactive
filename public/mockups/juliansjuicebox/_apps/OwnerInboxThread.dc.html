<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Message</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Message</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:12px;align-items:flex-start">
<span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:50%;background:{{thread.avatarBg}};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">{{thread.initials}}</span>
<div style="flex:1;min-width:0">
<h2 style="margin:0;font-size:17px;{{theme.head}}">{{thread.subject}}</h2>
<p style="margin:4px 0 0;font-size:13px;color:{{theme.muted}}">{{thread.from}} &lt;{{thread.email}}&gt; · {{thread.meta}}</p>
</div>
</div>
<div style="{{theme.card}}"><p style="margin:0;line-height:1.6">{{thread.body}}</p></div>
<sc-if value="{{thread.hasOrder}}" hint-placeholder-val="{{false}}"><a href="{{thread.orderHref}}" style="{{theme.btnGhost}};text-decoration:none">Open {{thread.from}}'s order {{thread.orderId}}</a></sc-if>
<h3 style="margin:0;font-size:14px">Reply to {{thread.from}}</h3>
<div style="border:{{theme.borderLight}};border-radius:10px;overflow:hidden">
<div style="display:flex;gap:4px;padding:6px 8px;border-bottom:{{theme.borderLight}};background:{{theme.bg}}">
<button type="button" onClick="{{toggleBold}}" aria-pressed="{{boldOn}}" aria-label="Bold" style="min-width:32px;min-height:32px;border:0;border-radius:6px;background:{{boldBg}};font-weight:800;font-size:13px;cursor:pointer">B</button>
<button type="button" onClick="{{toggleItalic}}" aria-pressed="{{italicOn}}" aria-label="Italic" style="min-width:32px;min-height:32px;border:0;border-radius:6px;background:{{italicBg}};font-style:italic;font-weight:700;font-size:13px;cursor:pointer">I</button>
<button type="button" onClick="{{toggleAttach}}" aria-pressed="{{attachOn}}" aria-label="Attach file" style="min-width:32px;min-height:32px;border:0;border-radius:6px;background:{{attachBg}};font-size:14px;cursor:pointer">📎</button>
</div>
<textarea rows="4" placeholder="Write your message…" style="width:100%;display:block;padding:12px;border:0;font:inherit;resize:vertical"></textarea>
</div>
<sc-if value="{{attachOn}}" hint-placeholder-val="{{false}}"><p style="margin:0;font-size:12px;color:{{theme.muted}}">📎 order-photo.jpg attached (sample)</p></sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Reply sent.</p></sc-if>
<sc-if value="{{inserted}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Saved answer inserted.</p></sc-if>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<button type="button" onClick="{{send}}" style="{{theme.btnPrimary}}">Send reply</button>
<button type="button" onClick="{{insert}}" style="{{theme.btnGhost}}">Insert saved answer</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};

var boldOn = !!st.boldOn, italicOn = !!st.italicOn, attachOn = !!st.attachOn;
var toolbarVals = { boldOn: boldOn, italicOn: italicOn, attachOn: attachOn,
boldBg: boldOn ? theme.accentSoft : 'transparent', italicBg: italicOn ? theme.accentSoft : 'transparent', attachBg: attachOn ? theme.accentSoft : 'transparent',
toggleBold: function () { self.setState({ boldOn: !boldOn }); }, toggleItalic: function () { self.setState({ italicOn: !italicOn }); }, toggleAttach: function () { self.setState({ attachOn: !attachOn }); } };
var id = (new URLSearchParams(location.search)).get('id') || 't1';
var raw = [
['t1','Dana R.','DR','9:12 AM',true,'Winter Cleanse — can I swap a juice?','Hi Julian, I can\'t do pineapple…','Hi Julian, I can\'t do pineapple. Could I swap Beauty Juice and Tropic Breeze for extra Green House in my Winter Cleanse box?','customer since 2025 · 3 orders · has the app','dana@example.com','#2143'],
['t2','Marcus T.','MT','8:40 AM',true,'Order #2141 delivery day','Will my box go out Monday?','Will my box go out Monday? I want to make sure it’s not sitting on a porch all weekend.','customer since 2025 · 1 order','marcus@example.com','#2141'],
['t3','Website contact form','WC','Yesterday',false,'Start Your Own Juice Business','I’d like to learn more about…','I’d like to learn more about licensing a juice program for my own studio. Do you offer any kind of partnership?','via juliansjuicebox.com','contact-form@juliansjuicebox.com',''],
['t4','Priya K.','PK','Yesterday',false,'Thank you!','The 3-day reset was great…','The 3-day reset was great — I felt amazing by day two. Already told my sister to order one for herself.','customer since 2024 · 6 orders','priya@example.com','']
];
var match = raw.filter(function (t) { return t[0] === id; })[0] || raw[0];
var i = raw.indexOf(match);
var thread = { id: match[0], from: match[1], initials: match[2], time: match[3], subject: match[5], body: match[7],
meta: match[8], email: match[9], orderId: match[10], hasOrder: !!match[10],
avatarBg: theme.avatarColors[i % theme.avatarColors.length],
orderHref: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/orders/detail?id=' + encodeURIComponent(match[10]) };
return Object.assign({ theme: theme, thread: thread, back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/inbox',
sent: !!st.sent, inserted: !!st.inserted,
send: function () { self.setState({ sent: true }); }, insert: function () { self.setState({ inserted: true }); } }, toolbarVals);
}
}
</script>
</body>
</html>
