<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Create a code</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content"><sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>

<sc-if value="{{created}}" hint-placeholder-val="{{false}}">
<div style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">
<p style="margin:0;font-weight:700">Code {{code}} created.</p>
<a class="jj-app-button jj-primary" href="{{back}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.accent}};color:{{theme.white}};text-decoration:none">Back to discount codes</a>
</div>
</sc-if>
<sc-if value="{{!created}}" hint-placeholder-val="{{true}}">
<label style="font-weight:600;font-size:13px">Code<input type="text" value="{{code}}" onChange="{{onCode}}" placeholder="e.g. SPRING20" style="min-height:46px;padding:0 14px;border:{{theme.borderLight}};border-radius:{{theme.radiusSmall}};font:inherit;width:100%;margin-top:6px;text-transform:uppercase"></label>
<label style="font-weight:600;font-size:13px">Percent off<input type="number" value="{{percent}}" onChange="{{onPercent}}" placeholder="10" style="min-height:46px;padding:0 14px;border:{{theme.borderLight}};border-radius:{{theme.radiusSmall}};font:inherit;width:100%;margin-top:6px"></label>
<button class="jj-app-button jj-primary" type="button" onClick="{{create}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.accent}};color:{{theme.white}}">Create code</button>
</sc-if>

<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var app = window.JJAppState.load(theme.design);
var code = (st.code || '').toUpperCase();
var percent = st.percent || '';
var back = '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more/discounts';
return { theme: theme, code: code, percent: percent, created: !!st.created, back: back,
onCode: function (e) { self.setState({ code: e.target.value }); }, onPercent: function (e) { self.setState({ percent: e.target.value }); },
create: function () { if (!code) return; var list = (app.discountCodes || []).concat([{ code: code, desc: (percent || '0') + '% off', status: 'Active', color: theme.accent }]); window.JJAppState.save(theme.design, { discountCodes: list }); self.setState({ created: true }); } };
}
}
</script>
</body>
</html>
