<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Create a code</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Create a code</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<sc-if value="{{created}}" hint-placeholder-val="{{false}}">
<div style="{{theme.card}};text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">
<p style="margin:0;font-weight:700">Code {{code}} created.</p>
<a href="{{back}}" style="{{theme.btnPrimary}};text-decoration:none">Back to discount codes</a>
</div>
</sc-if>
<sc-if value="{{!created}}" hint-placeholder-val="{{true}}">
<label style="font-weight:600;font-size:13px">Code<input type="text" value="{{code}}" onChange="{{onCode}}" placeholder="e.g. SPRING20" style="{{theme.input}};margin-top:6px;text-transform:uppercase"></label>
<label style="font-weight:600;font-size:13px">Percent off<input type="number" value="{{percent}}" onChange="{{onPercent}}" placeholder="10" style="{{theme.input}};margin-top:6px"></label>
<button type="button" onClick="{{create}}" style="{{theme.btnPrimary}}">Create code</button>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var app = window.JJAppState.load(theme.design);
var code = (st.code || '').toUpperCase();
var percent = st.percent || '';
var back = '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more/discounts';
return { theme: theme, code: code, percent: percent, created: !!st.created, back: back,
onCode: function (e) { self.setState({ code: e.target.value }); }, onPercent: function (e) { self.setState({ percent: e.target.value }); },
create: function () { if (!code) return; var list = (app.discountCodes || []).concat([{ code: code, desc: (percent || '0') + '% off', status: 'Active', color: theme.accent }]); window.JJAppState.save(theme.design, { discountCodes: list }); self.setState({ created: true }); } };
}
}
</script>
</body>
</html>
