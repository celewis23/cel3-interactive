<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Upload a photo</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Upload a photo</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<input type="file" id="site-upload" accept="image/*" onChange="{{onFile}}" style="position:absolute;width:1px;height:1px;opacity:0">
<label for="site-upload" style="{{theme.btnGhost}};text-align:center;cursor:pointer">Choose a photo</label>
<sc-if value="{{fileName}}" hint-placeholder-val="{{false}}"><p style="margin:0;font-size:13px;color:{{theme.muted}}">Selected: {{fileName}}</p></sc-if>
<sc-if value="{{uploaded}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Added to your media library.</p></sc-if>
<sc-if value="{{needsFile}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.danger}}">Please choose a photo first.</p></sc-if>
<button type="button" onClick="{{upload}}" style="{{theme.btnPrimary}}">Upload</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
return { theme: theme, back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/site/media',
fileName: st.fileName || '', uploaded: !!st.uploaded, needsFile: !!st.needsFile,
onFile: function (e) { var f = e.target.files && e.target.files[0]; self.setState({ fileName: f ? f.name : '', uploaded: false, needsFile: false }); },
upload: function () { if (!st.fileName) { self.setState({ needsFile: true }); return; } self.setState({ uploaded: true, needsFile: false }); } };
}
}
</script>
</body>
</html>
