<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — More</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">

<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<sc-for list="{{items}}" as="m" hint-placeholder-count="11">
<a href="{{m.href}}" style="{{theme.card}};display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:inherit"><span style="font-weight:700">{{m.label}}</span><span aria-hidden="true">→</span></a>
</sc-for>
</div>
<nav aria-label="App" style="{{theme.tabBar}};grid-template-columns:repeat(5,1fr)">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
<a href="{{tb.href}}" aria-current="{{tb.on}}" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;text-decoration:none;background:{{tb.bg}};color:{{tb.fg}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.d}}"></path></svg>
<span>{{tb.label}}</span>
<sc-if value="{{tb.hasBadge}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position:absolute;top:2px;right:18%;min-width:14px;height:14px;border-radius:7px;background:#e0901a;color:#1c1c1a;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px">{{tb.badge}}</span></sc-if>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var theme = window.JJTheme.current();
var base = '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more';
var items = [['Products','/products'],['Inventory','/inventory'],['Customers','/customers'],['Subscriptions','/subscriptions'],
['Discount codes','/discounts'],['Bulletins sent','/bulletins'],['Abandoned carts','/carts'],['Reviews','/reviews'],
['Analytics','/analytics'],['Notifications','/notifications'],['Store settings','/settings']].map(function (i) { return { label: i[0], href: base + i[1] }; });
var tabs = window.JJKit.ownerTabs(theme.design, 'more');
return { theme: theme, items: items, tabs: tabs };
}
}
</script>
</body>
</html>
