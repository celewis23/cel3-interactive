<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Adjust stock</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content"><sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>

<div style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px;text-align:center">
<h2 style="margin:0 0 6px;font-size:19px;font-family:{{theme.displayFont}};font-weight:{{theme.displayWeight}};text-transform:{{theme.displayTransform}};letter-spacing:{{theme.displayTracking}};line-height:1">{{name}}</h2>
<p style="margin:0;font-size:32px;font-weight:800">{{stock}}</p>
<p style="margin:0;color:{{theme.muted}}">bottles in stock</p>
</div>
<div style="display:flex;gap:10px">
<button class="jj-app-button" type="button" onClick="{{dec}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.surface}};color:{{theme.ink}};border:{{theme.borderLight}};flex:1">− Remove 1</button>
<button class="jj-app-button jj-primary" type="button" onClick="{{inc}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.accent}};color:{{theme.white}};flex:1">+ Add 1</button>
</div>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Stock updated.</p></sc-if>

<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var app = window.JJAppState.load(theme.design);
var adjust = app.stockAdjust || {};
var id = (new URLSearchParams(location.search)).get('id') || 'seasonal';
var raw = [
['seasonal','cleanse','Winter Juice Cleanse','Our 36th seasonal cleanse: 24 juices, 3 immunity shots and 1 free 8oz shot. Limited boxes.',149.99,'$149.99',1],

['risepack','packs','Rise N Shine Juice Pack','A full pack of Rise N Shine.',104,'From $104.00',1]
];
var match = raw.filter(function (r) { return r[0] === id; })[0] || raw[0];
var base = 5 + (match[2].split('').reduce(function (a, c) { return a + c.charCodeAt(0); }, 0) % 40);
var stock = Math.max(0, base + (adjust[match[0]] || 0));
var bump = function (d) { return function () { var a = Object.assign({}, adjust); a[match[0]] = (a[match[0]] || 0) + d; window.JJAppState.save(theme.design, { stockAdjust: a }); self.setState({ saved: true }); }; };
return { theme: theme, name: match[2], stock: stock, saved: !!st.saved, inc: bump(1), dec: bump(-1),
back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more/inventory' };
}
}
</script>
</body>
</html>
