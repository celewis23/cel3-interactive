<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Inbox</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content">
<sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>
<input type="search" placeholder="Search mail" aria-label="Search mail" value="{{query}}" onChange="{{onSearch}}" style="min-height:46px;padding:0 14px;border:{{theme.borderLight}};border-radius:{{theme.radiusSmall}};font:inherit;width:100%">
<div class="jj-app-inbox" style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px"><sc-for list="{{threads}}" as="t"><a href="{{t.href}}"><span class="jj-avatar" style="background:{{t.avatarBg}}">{{t.initials}}</span><span style="flex:1;min-width:0"><span style="display:flex;justify-content:space-between;gap:8px"><strong style="font-weight:{{t.nameWeight}}">{{t.from}}</strong><span style="font-size:11px;color:{{theme.muted}}">{{t.time}}</span></span><span style="display:block;font-weight:{{t.nameWeight}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.subject}}</span><span style="display:block;font-size:13px;color:{{theme.muted}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.preview}}</span></span><sc-if value="{{t.unread}}"><span aria-label="Unread" style="width:8px;height:8px;flex:none;border-radius:{{theme.radiusPill}};background:{{theme.cta}};margin-top:8px"></span></sc-if></a></sc-for></div>
<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var query = (st.query || '').toLowerCase();
var starred = st.starredThreads || {};
var toggleStar = function (id) { return function (e) { e.stopPropagation(); var s = Object.assign({}, starred); s[id] = !s[id]; self.setState({ starredThreads: s }); }; };
var base = '/mockups/juliansjuicebox/' + theme.design + '/app/owner/inbox/thread?id=';
var raw = [
['t1','Dana R.','DR','9:12 AM',true,'Winter Cleanse — can I swap a juice?','Hi Julian, I can\'t do pineapple…','Hi Julian, I can\'t do pineapple. Could I swap Beauty Juice and Tropic Breeze for extra Green House in my Winter Cleanse box?','customer since 2025 · 3 orders · has the app','dana@example.com','#2143'],
['t2','Marcus T.','MT','8:40 AM',true,'Order #2141 delivery day','Will my box go out Monday?','Will my box go out Monday? I want to make sure it’s not sitting on a porch all weekend.','customer since 2025 · 1 order','marcus@example.com','#2141'],
['t3','Website contact form','WC','Yesterday',false,'Start Your Own Juice Business','I’d like to learn more about…','I’d like to learn more about licensing a juice program for my own studio. Do you offer any kind of partnership?','via juliansjuicebox.com','contact-form@juliansjuicebox.com',''],
['t4','Priya K.','PK','Yesterday',false,'Thank you!','The 3-day reset was great…','The 3-day reset was great — I felt amazing by day two. Already told my sister to order one for herself.','customer since 2024 · 6 orders','priya@example.com','']
];
var all = raw.map(function (t, i) {
var isStarred = !!starred[t[0]];
return { id: t[0], initials: t[2], avatarBg: theme.avatarColors[i % theme.avatarColors.length], time: t[3], unread: t[4],
nameWeight: t[4] ? 700 : 500, from: t[1], subject: t[5], preview: t[6], bg: theme.surface, href: base + t[0],
starred: isStarred, starGlyph: isStarred ? '★' : '☆', starColor: isStarred ? theme.cta : theme.muted,
starLabel: (isStarred ? 'Unstar' : 'Star') + ' email from ' + t[1], toggleStar: toggleStar(t[0]) };
});
var threads = query ? all.filter(function (t) { return (t.from + ' ' + t.subject).toLowerCase().indexOf(query) !== -1; }) : all;
var tabs = window.JJKit.ownerTabs(theme.design, 'inbox');
return { theme: theme, threads: threads, tabs: tabs, query: st.query || '', onSearch: function (e) { self.setState({ query: e.target.value }); } };
}
}
</script>
</body>
</html>
