<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Julian's Juicebox — Checkout</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Checkout</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<sc-if value="{{isDetails}}" hint-placeholder-val="{{true}}">
<label style="font-weight:600;font-size:13px">Full name<input type="text" value="{{name}}" onChange="{{onName}}" style="{{theme.input}};margin-top:6px"></label>
<label style="font-weight:600;font-size:13px">Shipping address<input type="text" value="{{address}}" onChange="{{onAddress}}" placeholder="Street, city, state, ZIP" style="{{theme.input}};margin-top:6px"></label>
<sc-if value="{{needsDetails}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.danger}}">Please add your name and address.</p></sc-if>
<button type="button" onClick="{{continueToPayment}}" style="{{theme.btnPrimary}}">Continue to payment</button>
</sc-if>
<sc-if value="{{isPayment}}" hint-placeholder-val="{{false}}">
<div style="{{theme.card}}">
<p style="margin:0 0 6px;font-weight:700">Payment</p>
<p style="margin:0;color:{{theme.muted}}">Visa ending [####]</p>
</div>
<div style="{{theme.cardFlat}};display:flex;justify-content:space-between;font-weight:800;font-size:18px"><span>Total due today</span><span>{{total}}</span></div>
<button type="button" onClick="{{pay}}" style="{{theme.btnPrimary}}">Pay {{total}}</button>
</sc-if>
<sc-if value="{{isConfirmation}}" hint-placeholder-val="{{false}}">
<div style="{{theme.card}};text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">
<p style="margin:0;font-weight:700">Order placed — {{orderId}}</p>
<p style="margin:0;color:{{theme.muted}}">{{total}} charged to your Visa ending [####].</p>
<a href="{{orderHref}}" style="{{theme.btnPrimary}};text-decoration:none">View order</a>
<a href="{{back}}" style="{{theme.btnGhost}};text-decoration:none">Back to Order</a>
</div>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var step = st.step || 'details';
var name = st.name || '', address = st.address || '';
var cart = window.JuiceboxCart ? window.JuiceboxCart.load(theme.design) : {};
var raw = [
['seasonal','cleanse','Winter Juice Cleanse','Our 36th seasonal cleanse: 24 juices, 3 immunity shots and 1 free 8oz shot. Limited boxes.',149.99,'$149.99',1],
['master','cleanse','Master Cleanse','A full-body reset designed to detox and restore balance from head to toe.',108,'From $108.00',1],
['weight','cleanse','Weight Loss Cleanse','Nourish your body while helping to reach your weight loss goals.',108,'From $108.00',1],
['gut','cleanse','Gut Reset Cleanse','Promote digestion and gut health with this targeted cleanse.',104,'From $104.00',1],
['antiaging','cleanse','Anti-Aging Cleanse','[SHORT DESCRIPTION]',108,'From $108.00',1],
['lowsugar','cleanse','Low Sugar Cleanse (Diabetic Friendly)','Diabetic-friendly, low-sugar options for stable energy and wellness.',108,'From $108.00',1],
['liver','cleanse','Liver & Colon Cleanse','Support detoxification and rejuvenation for a healthier you.',108,'From $108.00',1],
['thirty','cleanse','30 Day Juice Cleanse','Julian\'s Juicebox x ImaniRaw: 240 bottles (8 per day) and 30 immunity shots.',1500,'$1,500.00',1],
['immune','goal','Immune Boost Box','Tropic Breeze, Sweet Red, Apple A Day, Rise N Shine and Beauty Juice.',54,'From $54.00',1],
['energy','goal','Energy Box','[SHORT DESCRIPTION]',0,'[PRICE]',1],
['fruit','goal','Fruit Juicebox','[SHORT DESCRIPTION]',54,'From $54.00',1],
['veggie','goal','Veggie Juicebox','Rise N Shine, Liver Tonic, Beauty Juice and Greenhouse.',54,'From $54.00',1],
['monthly','goal','Monthly Juice Box','[SHORT DESCRIPTION]',187.5,'From $187.50',1],
['apple','juice','Apple A Day','Granny Smith, Pink Lady & Fuji apple, ginger.',7,'$7.00',1],
['beauty','juice','Beauty Juice','Pineapple, cucumber, celery, cilantro, mint.',7,'$7.00',1],
['green','juice','Green House','Celery, cucumber, green apple, kale, lemon, ginger, parsley.',7,'$7.00',1],
['lemonade','juice','Lemonade Stand','Green apple, lemon.',7,'$7.00',1],
['livertonic','juice','Liver Tonic','Beet, pineapple, Fuji apple, lemon, ginger.',7,'$7.00',1],
['rise','juice','Rise & Shine','Carrot, orange, lemon, ginger.',7,'$7.00',1],
['sweetred','juice','Sweet Red','Red grapes.',7,'$7.00',1],
['grape','juice','Grape Lemonade','[INGREDIENTS]',7,'$7.00',0],
['hydrator','juice','Hydrator','Watermelon, lime.',7,'$7.00',0],
['strawberry','mylk','Strawberry Mylk','Cashews, strawberries, dates & coconut water.',7.5,'$7.50',1],
['banana','mylk','Banana Mylk','Walnuts, bananas, dates & coconut water.',7.5,'$7.50',0],
['chocolate','mylk','Chocolate Mylk','Almonds, cacao, dates & coconut water.',7.5,'$7.50',0],
['mylkpack','mylk','Mylk Pack','21 bottles — 7 each of Chocolate, Strawberry and Banana Mylk.',0,'[PRICE]',1],
['shot','shots','Immunity Booster Shot','2 oz of pineapple, orange, lemon, ginger, turmeric and black pepper.',4.5,'$4.50',1],
['shot30','shots','Immunity Booster Shots (30 Pack)','A month of your daily boost.',119.99,'$119.99',1],
['risepack','packs','Rise N Shine Juice Pack','A full pack of Rise N Shine.',104,'From $104.00',1]
];
var money = function (n) { return '$' + n.toFixed(2); };
var subtotal = 0, itemNames = [];
raw.forEach(function (r) { if (cart[r[0]]) { subtotal += (r[4] || 0) * cart[r[0]]; itemNames.push(r[2] + ' × ' + cart[r[0]]); } });
var app = window.JJAppState.load(theme.design);
var orderId = st.orderId || ('#' + (2144 + (app.placedOrders || []).length));
return { theme: theme, isDetails: step === 'details', isPayment: step === 'payment', isConfirmation: step === 'confirmation',
name: name, address: address, needsDetails: !!st.needsDetails, total: money(subtotal), orderId: orderId,
back: '/mockups/juliansjuicebox/' + theme.design + '/app', orderHref: '/mockups/juliansjuicebox/' + theme.design + '/app/orders/detail?id=' + encodeURIComponent(orderId),
onName: function (e) { self.setState({ name: e.target.value }); }, onAddress: function (e) { self.setState({ address: e.target.value }); },
continueToPayment: function () { if (!name.trim() || !address.trim()) { self.setState({ needsDetails: true }); return; } self.setState({ step: 'payment', needsDetails: false }); },
pay: function () {
var order = { id: orderId, items: itemNames.join(', ') || 'Your box', total: money(subtotal), placedAt: 'just now', status: 'Ordered' };
var list = (app.placedOrders || []).concat([order]);
window.JJAppState.save(theme.design, { placedOrders: list });
if (window.JuiceboxCart) window.JuiceboxCart.save(theme.design, {});
self.setState({ step: 'confirmation', orderId: orderId });
} };
}
}
</script>
</body>
</html>
