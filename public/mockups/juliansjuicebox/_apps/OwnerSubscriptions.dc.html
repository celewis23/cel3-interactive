<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Subscriptions</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Subscriptions</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="{{theme.card}};display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;gap:8px"><strong>Dana R.</strong><span style="padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:{{statusBg}};color:{{theme.ink}}">{{statusLabel}}</span></div>
<p style="margin:0;color:{{theme.muted}}">Winter Cleanse · monthly · next renewal {{nextDate}}</p>
<div style="display:flex;gap:8px"><button type="button" onClick="{{toggle}}" style="{{theme.btnGhost}};flex:1">{{toggleLabel}}</button></div>
</div>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><p style="margin:0;color:{{theme.accent}};font-weight:700">Updated — this also updates what Dana sees in her app.</p></sc-if>
<p style="margin:0;font-size:12px;color:{{theme.muted}}">Only one active subscriber in this preview.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var app = window.JJAppState.load(theme.design);
var sub = app.subscription || { status: 'active', nextDate: 'Dec 9' };
var active = sub.status === 'active';
return { theme: theme, statusLabel: active ? 'Active' : 'Paused', statusBg: active ? theme.accentSoft : theme.gold,
nextDate: sub.nextDate, toggleLabel: active ? 'Pause subscription' : 'Resume subscription', saved: !!st.saved,
back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more',
toggle: function () { window.JJAppState.save(theme.design, { subscription: Object.assign({}, sub, { status: active ? 'paused' : 'active' }) }); self.setState({ saved: true }); } };
}
}
</script>
</body>
</html>
