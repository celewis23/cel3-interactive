<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Customer</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">Customer</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<div style="{{theme.card}}">
<h2 style="margin:0 0 4px;font-size:19px;{{theme.head}}">{{customer.name}}</h2>
<p style="margin:0;color:{{theme.muted}}">{{customer.email}} · {{customer.meta}}</p>
</div>
<h3 style="margin:0;font-size:14px">Orders</h3>
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<a href="{{o.href}}" style="{{theme.card}};display:flex;justify-content:space-between;text-decoration:none;color:inherit"><span>{{o.id}} · {{o.items}}</span><span>{{o.total}}</span></a>
</sc-for>
</div>
<sc-if value="{{!orders.length}}" hint-placeholder-val="{{true}}"><p style="margin:0;color:{{theme.muted}}">No orders yet.</p></sc-if>
<sc-if value="{{thread}}" hint-placeholder-val="{{false}}"><a href="{{threadHref}}" style="{{theme.btnPrimary}};text-decoration:none">Message {{customer.name}}</a></sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var theme = window.JJTheme.current();
var id = (new URLSearchParams(location.search)).get('id') || 'dana';
var people = {
dana: { name: 'Dana R.', email: 'dana@example.com', meta: 'customer since 2025 · subscription active', thread: 't1' },
marcus: { name: 'Marcus T.', email: 'marcus@example.com', meta: 'customer since 2025', thread: 't2' },
priya: { name: 'Priya K.', email: 'priya@example.com', meta: 'customer since 2024', thread: null },
terrence: { name: 'Terrence B.', email: 'terrence@example.com', meta: 'customer since 2025', thread: null },
monique: { name: 'Monique S.', email: 'monique@example.com', meta: 'customer since 2025', thread: null },
alicia: { name: 'Alicia M.', email: 'alicia@example.com', meta: 'customer since 2025', thread: null }
};
var customer = people[id] || people.dana;
var ordersRaw = [
['#2143','Dana R.','Winter Cleanse','Richmond, VA','[PRICE]','dana@example.com'],
['#2142','Alicia M.','Build A Box · 12 bottles','Atlanta, GA','$84.00','alicia@example.com'],
['#2141','Marcus T.','Immune Boost box','Columbus, OH','[PRICE]','marcus@example.com'],
['#2140','Priya K.','Immunity Shots × 6','Charlotte, NC','[PRICE]','priya@example.com'],
['#2139','Terrence B.','Low Sugar Cleanse','Dallas, TX','[PRICE]','terrence@example.com'],
['#2138','Monique S.','Build A Box · 6 bottles','Baltimore, MD','$42.00','monique@example.com']
];
var orders = ordersRaw.filter(function (r) { return r[1] === customer.name; }).map(function (r) {
return { id: r[0], items: r[2], total: r[4], href: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/orders/detail?id=' + encodeURIComponent(r[0]) };
});
return { theme: theme, customer: customer, orders: orders, thread: customer.thread,
threadHref: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/inbox/thread?id=' + customer.thread,
back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/more/customers' };
}
}
</script>
</body>
</html>
