<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Julian's Juicebox — Product</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content"><sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>

<div style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px">
<h2 style="margin:0 0 6px;font-size:21px;font-family:{{theme.displayFont}};font-weight:{{theme.displayWeight}};text-transform:{{theme.displayTransform}};letter-spacing:{{theme.displayTracking}};line-height:1">{{product.name}}</h2>
<p style="margin:0 0 10px;color:{{theme.muted}}">{{product.catLabel}}</p>
<p style="margin:0 0 10px">{{product.desc}}</p>
<p style="margin:0;font-size:20px;font-weight:800">{{product.priceLabel}}</p>
</div>
<sc-if value="{{product.soldOut}}" hint-placeholder-val="{{false}}">
<div style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px;text-align:center">
<p style="margin:0 0 10px;font-weight:700;color:{{theme.danger}}">Sold out</p>
<button class="jj-app-button" type="button" onClick="{{notify}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.surface}};color:{{theme.ink}};border:{{theme.borderLight}}">{{notifyLabel}}</button>
</div>
</sc-if>
<sc-if value="{{!product.soldOut}}" hint-placeholder-val="{{true}}">
<div style="display:flex;align-items:center;gap:14px;justify-content:center">
<button class="jj-app-button" type="button" onClick="{{dec}}" aria-label="Decrease quantity" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.surface}};color:{{theme.ink}};border:{{theme.borderLight}};width:48px;padding:0">−</button>
<span style="font-size:20px;font-weight:800;min-width:30px;text-align:center">{{qty}}</span>
<button class="jj-app-button" type="button" onClick="{{inc}}" aria-label="Increase quantity" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.surface}};color:{{theme.ink}};border:{{theme.borderLight}};width:48px;padding:0">+</button>
</div>
<button class="jj-app-button jj-primary" type="button" onClick="{{add}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.accent}};color:{{theme.white}}">{{addLabel}}</button>
</sc-if>

<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {

var theme = window.JJTheme.current();
var st = this.state || {};
var qty = st.qty || 1;
var id = (new URLSearchParams(location.search)).get('id') || 'seasonal';
var raw = [
['seasonal','cleanse','Winter Juice Cleanse','Our 36th seasonal cleanse: 24 juices, 3 immunity shots and 1 free 8oz shot. Limited boxes.',149.99,'$149.99',1],

];
var catNames = {"cleanse":"Cleansing Juiceboxes","goal":"Goal Oriented Juiceboxes","juice":"Build A Box","mylk":"Nut Mylks","shots":"Immunity Shots","packs":"Juice Packs"};
var match = raw.filter(function (r) { return r[0] === id; })[0] || raw[0];
var product = { id: match[0], name: match[2], catLabel: catNames[match[1]], desc: match[3], priceLabel: match[5], soldOut: !match[6] };
return { theme: theme, product: product, qty: qty, added: !!st.added, notified: !!st.notified,
notifyLabel: st.notified ? "We'll let you know" : 'Notify me when back',
addLabel: st.added ? 'Added to box' : 'Add to box',
back: '/mockups/juliansjuicebox/' + theme.design + '/app',
inc: function () { self.setState({ qty: qty + 1, added: false }); }, dec: function () { self.setState({ qty: Math.max(1, qty - 1), added: false }); },
notify: function () { self.setState({ notified: true }); },
add: function () { var cart = window.JuiceboxCart ? window.JuiceboxCart.load(theme.design) : {}; var c = Object.assign({}, cart); c[product.id] = (c[product.id] || 0) + qty; if (window.JuiceboxCart) window.JuiceboxCart.save(theme.design, c); self.setState({ added: true }); } };
}
}
</script>
</body>
</html>
