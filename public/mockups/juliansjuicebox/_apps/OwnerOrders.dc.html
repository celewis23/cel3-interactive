<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — Orders</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content">
<sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>
<div class="jj-chips"><sc-for list="{{filters}}" as="f"><button class="jj-app-button" type="button" onClick="{{f.pick}}" style="display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border:0;font-family:{{theme.displayFont}};font-size:{{theme.buttonSize}};text-transform:{{theme.displayTransform}};font-weight:700;white-space:nowrap;cursor:pointer;border-radius:{{theme.radiusBtn}};background:{{theme.surface}};color:{{theme.ink}};border:{{theme.borderLight}};background:{{f.bg}};color:{{f.fg}}">{{f.label}}</button></sc-for></div><input type="search" placeholder="Search orders or customers" aria-label="Search orders" value="{{query}}" onChange="{{onSearch}}" style="min-height:46px;padding:0 14px;border:{{theme.borderLight}};border-radius:{{theme.radiusSmall}};font:inherit;width:100%">
<sc-for list="{{orders}}" as="o"><a class="jj-order-link" href="{{o.href}}"><span class="jj-order-line"><strong>{{o.id}} · {{o.who}}</strong><strong>{{o.total}}</strong></span><span class="jj-order-meta">{{o.items}} · {{o.to}}</span><span class="jj-order-line"><span class="jj-status-badge" style="background:{{o.statusBg}};color:{{o.statusFg}}">{{o.status}}</span><span aria-hidden="true">›</span></span></a></sc-for>
<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};
var filter = st.filter || 'all';
var query = (st.query || '').toLowerCase();
var app = window.JJAppState.load(theme.design);
var raw = [
['#2143','Dana R.','Winter Cleanse','Richmond, VA','$149.99','dana@example.com'],
['#2142','Alicia M.','Build A Box · 12 bottles','Atlanta, GA','$84.00','alicia@example.com'],
['#2141','Marcus T.','Immune Boost box','Columbus, OH','$54.00','marcus@example.com'],
['#2140','Priya K.','Immunity Shots × 6','Charlotte, NC','$27.00','priya@example.com'],
['#2139','Terrence B.','Low Sugar Cleanse','Dallas, TX','$108.00','terrence@example.com'],
['#2138','Monique S.','Build A Box · 6 bottles','Baltimore, MD','$42.00','monique@example.com']
];
var all = raw.map(function (r) {
var packed = !!app.packedOrders[r[0]];
var status = packed ? 'Packed' : 'To fill';
return { id: r[0], who: r[1], items: r[2], to: r[3], total: r[4], email: r[5], status: status,
statusBg: packed ? theme.accentSoft : theme.gold, statusFg: theme.ink,
href: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/orders/detail?id=' + encodeURIComponent(r[0]) };
});
var filtered = all.filter(function (o) {
if (filter === 'tofill' && o.status !== 'To fill') return false;
if (filter === 'packed' && o.status !== 'Packed') return false;
if (query && (o.who + ' ' + o.id).toLowerCase().indexOf(query) === -1) return false;
return true;
});
var filters = [['all','All'],['tofill','To fill'],['packed','Packed'],['shipped','Shipped']].map(function (f) {
var on = f[0] === filter;
return { label: f[1], bg: on ? theme.ink : theme.surface, fg: on ? theme.white : theme.ink, pick: function () { self.setState({ filter: f[0] }); } };
});
var tabs = window.JJKit.ownerTabs(theme.design, 'orders');
return { theme: theme, orders: filtered, filters: filters, tabs: tabs,
query: st.query || '', onSearch: function (e) { self.setState({ query: e.target.value }); } };
}
}
</script>
</body>
</html>
