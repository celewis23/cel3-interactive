<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Julian's Juicebox — Bulletin</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content"><sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>

<div style="background:{{theme.surface}};border:{{theme.border}};border-radius:{{theme.radiusCard}};padding:18px">
<p style="margin:0 0 6px;font-size:12px;color:{{theme.muted}};text-transform:uppercase;font-weight:700">{{bulletin.sentAt}} · {{bulletin.audience}}</p>
<h2 style="margin:0 0 8px;font-size:21px;font-family:{{theme.displayFont}};font-weight:{{theme.displayWeight}};text-transform:{{theme.displayTransform}};letter-spacing:{{theme.displayTracking}};line-height:1">{{bulletin.title}}</h2>
<p style="margin:0">{{bulletin.body}}</p>
</div>

<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var theme = window.JJTheme.current();
var app = window.JJAppState.load(theme.design);
var id = (new URLSearchParams(location.search)).get('id') || 'b-seed-1';
var all = [
{ id: 'b-seed-1', title: 'Winter Cleanse boxes are almost gone', body: 'App family — you hear it first. Limited production, limited boxes. Order from the app before the website list opens.', sentAt: 'Today', audience: 'App family', unread: true },
{ id: 'b-seed-2', title: 'Our 36th Seasonal Cleanse is HERE!', body: '24 organic cold-pressed juices, 3 immunity shots, and 1 free 8oz shot, shipped to your doorstep.', sentAt: 'Nov 10', audience: 'All customers', unread: false },
{ id: 'b-seed-3', title: 'Strawberry Mylk is back', body: 'Back on the Build A Box menu while it lasts.', sentAt: 'Nov 3', audience: 'All customers', unread: false },
{ id: 'b-seed-4', title: 'Holiday shipping days', body: 'Shipments go out Monday through Wednesday.', sentAt: 'Oct 28', audience: 'All customers', unread: false }
].concat(app.sentBulletins || []);
var bulletin = all.filter(function (b) { return b.id === id; })[0] || all[0];
var read = Object.assign({}, app.readBulletins); read[bulletin.id] = true;
window.JJAppState.save(theme.design, { readBulletins: read });
return { theme: theme, bulletin: bulletin, back: '/mockups/juliansjuicebox/' + theme.design + '/app/bulletins' };
}
}
</script>
</body>
</html>
