<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/_apps/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="owner" defer></script>
<title>Julian's Juicebox — New message</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;900&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;font-family:{{theme.bodyFont}};background:{{theme.bg}};color:{{theme.ink}}">
<header style="{{theme.headerBar}}">
<a href="{{back}}" aria-label="Back" style="{{theme.backBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin:0;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;{{theme.head}}">New message</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div style="{{theme.card}};text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">
<p style="margin:0;font-weight:700">Message sent.</p>
<a href="{{back}}" style="{{theme.btnPrimary}};text-decoration:none">Back to Inbox</a>
</div>
</sc-if>
<sc-if value="{{!sent}}" hint-placeholder-val="{{true}}">
<label style="font-weight:600;font-size:13px">To<input type="text" placeholder="Customer name or email" style="{{theme.input}};margin-top:6px"></label>
<label style="font-weight:600;font-size:13px">Subject<input type="text" placeholder="Subject" style="{{theme.input}};margin-top:6px"></label>
<div style="border:{{theme.borderLight}};border-radius:10px;overflow:hidden">
<div style="display:flex;gap:4px;padding:6px 8px;border-bottom:{{theme.borderLight}};background:{{theme.bg}}">
<button type="button" onClick="{{toggleBold}}" aria-pressed="{{boldOn}}" aria-label="Bold" style="min-width:32px;min-height:32px;border:0;border-radius:6px;background:{{boldBg}};font-weight:800;font-size:13px;cursor:pointer">B</button>
<button type="button" onClick="{{toggleItalic}}" aria-pressed="{{italicOn}}" aria-label="Italic" style="min-width:32px;min-height:32px;border:0;border-radius:6px;background:{{italicBg}};font-style:italic;font-weight:700;font-size:13px;cursor:pointer">I</button>
<button type="button" onClick="{{toggleAttach}}" aria-pressed="{{attachOn}}" aria-label="Attach file" style="min-width:32px;min-height:32px;border:0;border-radius:6px;background:{{attachBg}};font-size:14px;cursor:pointer">📎</button>
</div>
<textarea rows="4" placeholder="Write your message…" style="width:100%;display:block;padding:12px;border:0;font:inherit;resize:vertical"></textarea>
</div>
<sc-if value="{{attachOn}}" hint-placeholder-val="{{false}}"><p style="margin:0;font-size:12px;color:{{theme.muted}}">📎 order-photo.jpg attached (sample)</p></sc-if>
<button type="button" onClick="{{send}}" style="{{theme.btnPrimary}}">Send</button>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var theme = window.JJTheme.current();
var st = this.state || {};

var boldOn = !!st.boldOn, italicOn = !!st.italicOn, attachOn = !!st.attachOn;
var toolbarVals = { boldOn: boldOn, italicOn: italicOn, attachOn: attachOn,
boldBg: boldOn ? theme.accentSoft : 'transparent', italicBg: italicOn ? theme.accentSoft : 'transparent', attachBg: attachOn ? theme.accentSoft : 'transparent',
toggleBold: function () { self.setState({ boldOn: !boldOn }); }, toggleItalic: function () { self.setState({ italicOn: !italicOn }); }, toggleAttach: function () { self.setState({ attachOn: !attachOn }); } };
return Object.assign({ theme: theme, back: '/mockups/juliansjuicebox/' + theme.design + '/app/owner/inbox',
sent: !!st.sent, send: function () { self.setState({ sent: true }); } }, toolbarVals);
}
}
</script>
</body>
</html>
