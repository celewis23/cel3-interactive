<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/a/app/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" data-design="a" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Customer PWA — Order</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content"><sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>

<a href="{{bulletin.href}}" style="display: block; text-decoration: none; background: {{theme.accent}}; color: {{theme.white}}; border-radius:{{theme.radiusCard}}; padding: 14px 16px"><span style="font-family:{{theme.displayFont}}; font-weight: 700; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: {{theme.gold}}">{{bulletin.tag}}</span><br><span style="font-weight: 600">{{bulletin.title}}</span></a>
<img src="./assets/808cf7128d9de6af0ea164f0ed65d68c.png" alt="Winter Cleanse lineup" style="width: 100%; height: 150px; object-fit: cover; border-radius:{{theme.radiusCard}}">
<div class="jj-chips" style="display: flex; gap: 8px; overflow-x: auto; font-family:{{theme.displayFont}}; font-weight: 700; font-size: 16px; letter-spacing: 0.06em; text-transform: uppercase">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button class="jj-app-button" type="button" onClick="{{c.pick}}" style="min-height: 44px; padding: 10px 14px; border-radius:{{theme.radiusSmall}}; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{theme.ink}}; font: inherit; white-space: nowrap; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
<sc-for list="{{products}}" as="p" hint-placeholder-count="8">
<div style="border: 2px solid {{theme.ink}}; border-radius:{{theme.radiusCard}}; padding: 8px; display: flex; align-items: center; gap: 12px">
<a href="{{p.href}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit">
<span aria-hidden="true" style="font-family:{{theme.displayFont}}; font-weight: 800; font-size: 36px; line-height: 0.9; color: {{p.color}}; width: 36px; text-align: center">{{p.qty}}</span>
<span style="flex: 1; min-width: 0"><span style="background: {{p.color}}; color: {{theme.white}}; border-radius:{{theme.radiusSmall}}; padding: 3px 8px; font-family:{{theme.displayFont}}; font-weight: 800; font-size: 17px; text-transform: uppercase; display: inline-block">{{p.name}}</span><div style="font-size: 13px; color: {{theme.muted}}; margin-top: 2px">{{p.desc}}</div><div style="font-weight: 600">{{p.priceLabel}}</div></span>
</a>
<sc-if value="{{p.soldOut}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 700; color: {{theme.danger}}">Sold out</span></sc-if>
<sc-if value="{{!p.soldOut}}" hint-placeholder-val="{{true}}"><button class="jj-app-button" type="button" onClick="{{p.add}}" aria-label="Add {{p.name}} to box" style="width: 48px; height: 48px; flex: none; border: 0; border-radius:{{theme.radiusSmall}}; background: {{theme.cta}}; color: {{theme.ink}}; font-size: 26px; font-weight: 700; cursor: pointer">+</button></sc-if>
</div>
</sc-for>

<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var theme = window.JJTheme.current();
var self = this;
var design = 'a';
var st = this.state || {};
var cat = st.cat || 'juice';
var cart = window.JuiceboxCart ? window.JuiceboxCart.load(design) : {};
var catNames = { cleanse: 'Cleanses', goal: 'Goal', juice: 'Build A Box', mylk: 'Nut Mylks', shots: 'Shots', packs: 'Juice Packs' };
var swatches = [theme.palette.color234f22, theme.palette.colorb54e08, theme.palette.color7a1f3d, theme.palette.color8a6400, theme.palette.color2f7d32, theme.accentDark];
var raw = [
['seasonal','cleanse','Winter Juice Cleanse','Our 36th seasonal cleanse: 24 juices, 3 immunity shots and 1 free 8oz shot.',149.99,'$149.99',1],
['master','cleanse','Master Cleanse','A full-body reset designed to detox and restore balance.',108,'From $108.00',1],
['immune','goal','Immune Boost Box','Tropic Breeze, Sweet Red, Apple A Day, Rise N Shine and Beauty Juice.',54,'From $54.00',1],
['veggie','goal','Veggie Juicebox','Rise N Shine, Liver Tonic, Beauty Juice and Greenhouse.',54,'From $54.00',1],
['green','juice','Green House','Celery, cucumber, apple, kale, lemon, ginger, parsley',7,'$7.00',1],
['rise','juice','Rise & Shine','Carrot, orange, lemon, ginger',7,'$7.00',1],
['livertonic','juice','Liver Tonic','Carrot, beet, Fuji apple, lemon, ginger',7,'$7.00',1],
['lemonade','juice','Lemonade Stand','Granny Smith apple, lemon',7,'$7.00',1],
['grape','juice','Grape Lemonade','[INGREDIENTS]',7,'$7.00',0],
['strawberry','mylk','Strawberry Mylk','Cashews, strawberries, dates & coconut water.',7.5,'$7.50',1],
['banana','mylk','Banana Mylk','Walnuts, bananas, dates & coconut water.',7.5,'$7.50',0],
['shot','shots','Immunity Booster Shot','2 oz of pineapple, orange, lemon, ginger, turmeric and black pepper.',4.5,'$4.50',1],
['shot30','shots','Immunity Booster Shots (30 Pack)','A month of your daily boost.',119.99,'$119.99',1],
['risepack','packs','Rise N Shine Juice Pack','A full pack of Rise N Shine.',104,'From $104.00',1]
];
var add = function (id) { return function () { var c = Object.assign({}, cart); c[id] = (c[id] || 0) + 1; cart = c; if (window.JuiceboxCart) window.JuiceboxCart.save(design, c); self.setState({ _t: Date.now() }); }; };
var all = raw.map(function (r, i) {
return { id: r[0], cat: r[1], name: r[2], desc: r[3], priceLabel: r[5], soldOut: !r[6], qty: cart[r[0]] || 0,
color: swatches[i % swatches.length], add: add(r[0]), href: '/mockups/juliansjuicebox/a/app/product?id=' + r[0] };
});
var products = all.filter(function (p) { return p.cat === cat; });
var cats = Object.keys(catNames).map(function (k) {
var on = k === cat;
return { key: k, label: catNames[k], bg: on ? theme.ink : theme.white, fg: on ? theme.white : theme.ink, pick: function () { self.setState({ cat: k }); } };
});
var boxCount = 0; Object.keys(cart).forEach(function (k) { boxCount += cart[k]; });
var app = window.JJAppState ? window.JJAppState.load(design) : { sentBulletins: [] };
var latestSent = (app.sentBulletins || []).slice(-1)[0];
var bulletin = latestSent
  ? { tag: 'New from Julian', title: latestSent.title, href: '/mockups/juliansjuicebox/a/app/bulletins' }
  : { tag: 'New bulletin from Julian', title: 'Winter Cleanse boxes are almost gone — app members order first.', href: '/mockups/juliansjuicebox/a/app/bulletins' };
return { cats: cats, products: products, boxCount: boxCount, bulletin: bulletin };
}
}
</script>
</body>
</html>
