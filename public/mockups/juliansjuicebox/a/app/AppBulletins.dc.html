<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/mockups/juliansjuicebox/a/app/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" data-design="a" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Customer PWA — Bulletins</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>


</helmet>
<div class="jj-app-screen" data-role="{{screenRole}}">
<header class="jj-app-header" data-role="{{screenRole}}">
<sc-if value="{{screenHasBack}}"><a class="jj-app-back" href="{{screenBack}}" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a></sc-if>
<div class="jj-app-heading"><p>{{screenEyebrow}}</p><h1>{{screenTitle}}</h1></div>
<sc-if value="{{screenAction}}"><a class="jj-header-action" href="{{screenActionHref}}" aria-label="{{screenActionLabel}}">{{screenActionText}}</a></sc-if>
</header>
<main class="jj-app-content" aria-label="Screen content"><sc-if value="{{screenSummary}}"><p class="jj-screen-summary">{{screenSummary}}</p></sc-if>

<sc-for list="{{bulletins}}" as="b" hint-placeholder-count="4">
<a href="{{b.href}}" style="display: block; text-decoration: none; color: inherit; border-top: 2px solid {{theme.ink}}; padding-top: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; font-family:{{theme.displayFont}}; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: {{theme.muted}}"><span>{{b.sentAt}}</span><sc-if value="{{b.unread}}" hint-placeholder-val="{{false}}"><span style="color: {{theme.accent}}">New</span></sc-if></div>
<h2 style="margin: 2px 0 4px; font-family:{{theme.displayFont}}; font-weight: 800; font-size: 22px; text-transform: uppercase">{{b.title}}</h2>
<p style="margin: 0; color: {{theme.muted}}">{{b.preview}}</p>
</a>
</sc-for>

<sc-if value="{{screenEmpty}}"><div class="jj-empty-state"><span aria-hidden="true">○</span><p>Nothing to show here right now.</p><small>Try another filter or return to the list.</small></div></sc-if>
<sc-if value="{{screenTip}}"><aside class="jj-layout-tip"><div class="jj-theme-shapes" aria-hidden="true"><i></i><i></i><i></i></div><p>{{screenTip}}</p></aside></sc-if>
</main>
<nav class="jj-app-tabs" data-role="{{screenRole}}" aria-label="App tabs">
<sc-for list="{{screenTabs}}" as="tb"><a href="{{tb.href}}" aria-current="{{tb.on}}" style="background:{{tb.bg}};color:{{tb.fg}}">{{tb.label}}</a></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends window.JJKit.AppScreen(DCLogic) {
screenVals() {
var theme = window.JJTheme.current();
var design = 'a';
var app = window.JJAppState ? window.JJAppState.load(design) : { readBulletins: {}, sentBulletins: [] };
var read = app.readBulletins || {};
var seed = [
{ id: 'b-seed-1', title: 'Winter Cleanse boxes are almost gone', preview: 'App family — you hear it first. Limited production, limited boxes. Order from the app before the website list opens.', sentAt: 'Today', unreadDefault: true },
{ id: 'b-seed-2', title: 'Our 36th Seasonal Cleanse is HERE!', preview: '24 organic cold-pressed juices, 3 immunity shots, and 1 free 8oz shot, shipped to your doorstep.', sentAt: 'Nov 10', unreadDefault: false },
{ id: 'b-seed-3', title: 'Strawberry Mylk is back', preview: 'Back on the Build A Box menu while it lasts.', sentAt: 'Nov 3', unreadDefault: false },
{ id: 'b-seed-4', title: 'Holiday shipping days', preview: 'Shipments go out Monday through Wednesday.', sentAt: 'Oct 28', unreadDefault: false }
];
var sent = (app.sentBulletins || []).slice().reverse().map(function (b) { return { id: b.id, title: b.title, preview: b.body, sentAt: b.sentAt, unreadDefault: true }; });
var all = sent.concat(seed);
var bulletins = all.map(function (b) {
return { id: b.id, title: b.title, preview: b.preview, sentAt: b.sentAt, unread: b.unreadDefault && !read[b.id],
href: '/mockups/juliansjuicebox/a/app/bulletins/detail?id=' + b.id };
});
return { bulletins: bulletins };
}
}
</script>
</body>
</html>
