<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/c/app/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/cart-state.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" data-design="c" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Customer PWA — Order</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{display:block}
a{color:#17140f}a:hover{color:#8c1c4a}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #17140f; font-family: 'DM Sans', sans-serif; font-size: 16px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 18px 18px 12px; display: flex; align-items: center; justify-content: space-between">
<img src="./assets/bfdb1cc27445575d8a051a44c5e91832.png" alt="Julian's Juicebox" style="height: 44px; width: auto">
<a href="/mockups/juliansjuicebox/c/app/box" style="min-height: 44px; padding: 10px 16px; border-radius: 999px; background: #17140f; color: #ffffff; text-decoration: none; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 11.2px; letter-spacing: 0; text-transform: uppercase">Box · {{boxCount}}</a>
</div>
<div style="flex: 1; overflow: hidden; overflow-y: auto; padding: 0 18px 12px; display: flex; flex-direction: column; gap: 14px">
<a href="{{bulletin.href}}" style="display: block; text-decoration: none; background: #8c1c4a; color: #ffffff; border-radius: 22px; padding: 14px 16px"><span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0; text-transform: uppercase; color: #ffd23f">{{bulletin.tag}}</span><br><span style="font-weight: 600">{{bulletin.title}}</span></a>
<img src="./assets/808cf7128d9de6af0ea164f0ed65d68c.png" alt="Winter Cleanse lineup" style="width: 100%; height: 150px; object-fit: cover; border-radius: 14px">
<div style="display: flex; gap: 8px; overflow-x: auto; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0; text-transform: uppercase">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" style="min-height: 44px; padding: 10px 14px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid #17140f; font: inherit; white-space: nowrap; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
<sc-for list="{{products}}" as="p" hint-placeholder-count="8">
<div style="border: 3px solid #17140f; border-radius: 24px; padding: 8px; display: flex; align-items: center; gap: 12px">
<a href="{{p.href}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit">
<span aria-hidden="true" style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 28px; line-height: 0.9; color: {{p.color}}; width: 36px; text-align: center">{{p.qty}}</span>
<span style="flex: 1; min-width: 0"><span style="background: {{p.color}}; color: #ffffff; border-radius: 999px; padding: 3px 8px; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 12px; text-transform: uppercase; display: inline-block">{{p.name}}</span><div style="font-size: 13px; color: #55504a; margin-top: 2px">{{p.desc}}</div><div style="font-weight: 600">{{p.priceLabel}}</div></span>
</a>
<sc-if value="{{p.soldOut}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: #8c1c4a">Sold out</span></sc-if>
<sc-if value="{{!p.soldOut}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{p.add}}" aria-label="Add {{p.name}} to box" style="width: 48px; height: 48px; flex: none; border: 0; border-radius: 999px; background: #ffd23f; color: #17140f; font-size: 26px; font-weight: 700; cursor: pointer">+</button></sc-if>
</div>
</sc-for>
</div>
<nav aria-label="App" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; border-top: 2px solid #17140f; padding: 8px 8px 14px; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0; text-transform: uppercase; text-align: center">
<a href="/mockups/juliansjuicebox/c/app" aria-current="true" style="min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #17140f; color: #ffffff; border-radius: 999px">Order</a>
<a href="/mockups/juliansjuicebox/c/app/orders" style="min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none">My orders</a>
<a href="/mockups/juliansjuicebox/c/app/bulletins" style="min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none">Bulletins</a>
<a href="/mockups/juliansjuicebox/c/app/account" style="min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none">Account</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var design = 'c';
var st = this.state || {};
var cat = st.cat || 'juice';
var cart = window.JuiceboxCart ? window.JuiceboxCart.load(design) : {};
var catNames = { cleanse: 'Cleanses', goal: 'Goal', juice: 'Build A Box', mylk: 'Nut Mylks', shots: 'Shots', packs: 'Juice Packs' };
var swatches = ['#234f22', '#b54e08', '#7a1f3d', '#8a6400', '#2f7d32', '#5a1230'];
var raw = [
['seasonal','cleanse','Winter Juice Cleanse','Our 36th seasonal cleanse: 24 juices, 3 immunity shots and 1 free 8oz shot.',149.99,'$149.99',1],
['master','cleanse','Master Cleanse','A full-body reset designed to detox and restore balance.',108,'From $108.00',1],
['immune','goal','Immune Boost Box','Tropic Breeze, Sweet Red, Apple A Day, Rise N Shine and Beauty Juice.',54,'From $54.00',1],
['veggie','goal','Veggie Juicebox','Rise N Shine, Liver Tonic, Beauty Juice and Greenhouse.',54,'From $54.00',1],
['green','juice','Green House','Celery, cucumber, apple, kale, lemon, ginger, parsley',7,'$7.00',1],
['rise','juice','Rise & Shine','Carrot, orange, lemon, ginger',7,'$7.00',1],
['livertonic','juice','Liver Tonic','Carrot, beet, Fuji apple, lemon, ginger',7,'$7.00',1],
['lemonade','juice','Lemonade Stand','Granny Smith apple, lemon',7,'$7.00',1],
['grape','juice','Grape Lemonade','[INGREDIENTS]',7,'$7.00',0],
['strawberry','mylk','Strawberry Mylk','Cashews, strawberries, dates & coconut water.',7.5,'$7.50',1],
['banana','mylk','Banana Mylk','Walnuts, bananas, dates & coconut water.',7.5,'$7.50',0],
['shot','shots','Immunity Booster Shot','2 oz of pineapple, orange, lemon, ginger, turmeric and black pepper.',4.5,'$4.50',1],
['shot30','shots','Immunity Booster Shots (30 Pack)','A month of your daily boost.',119.99,'$119.99',1],
['risepack','packs','Rise N Shine Juice Pack','A full pack of Rise N Shine.',104,'From $104.00',1]
];
var add = function (id) { return function () { var c = Object.assign({}, cart); c[id] = (c[id] || 0) + 1; cart = c; if (window.JuiceboxCart) window.JuiceboxCart.save(design, c); self.setState({ _t: Date.now() }); }; };
var all = raw.map(function (r, i) {
return { id: r[0], cat: r[1], name: r[2], desc: r[3], priceLabel: r[5], soldOut: !r[6], qty: cart[r[0]] || 0,
color: swatches[i % swatches.length], add: add(r[0]), href: '/mockups/juliansjuicebox/c/app/product?id=' + r[0] };
});
var products = all.filter(function (p) { return p.cat === cat; });
var cats = Object.keys(catNames).map(function (k) {
var on = k === cat;
return { key: k, label: catNames[k], bg: on ? '#17140f' : '#ffffff', fg: on ? '#ffffff' : '#17140f', pick: function () { self.setState({ cat: k }); } };
});
var boxCount = 0; Object.keys(cart).forEach(function (k) { boxCount += cart[k]; });
var app = window.JJAppState ? window.JJAppState.load(design) : { sentBulletins: [] };
var latestSent = (app.sentBulletins || []).slice(-1)[0];
var bulletin = latestSent
  ? { tag: 'New from Julian', title: latestSent.title, href: '/mockups/juliansjuicebox/c/app/bulletins' }
  : { tag: 'New bulletin from Julian', title: 'Winter Cleanse boxes are almost gone — app members order first.', href: '/mockups/juliansjuicebox/c/app/bulletins' };
return { cats: cats, products: products, boxCount: boxCount, bulletin: bulletin };
}
}
</script>
</body>
</html>
