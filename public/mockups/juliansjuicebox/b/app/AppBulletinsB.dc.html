<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/juliansjuicebox/b/app/">
<script src="/mockups/juliansjuicebox/_apps/app-kit.js"></script>
<script src="/mockups/juliansjuicebox/preview-chrome.js" data-section="app" data-design="b" defer></script>
<script src="/mockups/juliansjuicebox/phone-frame.js" data-role="customer" defer></script>
<title>Customer PWA — Bulletins</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
img{display:block}
a{color:#14261a}a:hover{color:#1f5c2c}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #ffffff; color: #14261a; font-family: 'Figtree', sans-serif; font-size: 16px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 22px 18px 12px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 35.2px; line-height: 1; text-transform: none">Bulletins</h1>
<p style="margin: 4px 0 0; color: #4a5a4e">From Julian, to the app family only.</p>
</div>
<div style="flex: 1; overflow: hidden; overflow-y: auto; padding: 0 18px 12px; display: flex; flex-direction: column; gap: 14px">
<a href="{{featured.href}}" style="background: #f6f7f4; border-radius: 22px; padding: 8px; display: block; text-decoration: none; color: inherit">
<div style="background: #1f5c2c; color: #ffffff; border-radius: 14px; padding: 8px 12px; display: flex; justify-content: space-between; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 13.2px; letter-spacing: 0; text-transform: none"><span>{{featured.tag}}</span><span>{{featured.sentAt}}</span></div>
<img src="./assets/808cf7128d9de6af0ea164f0ed65d68c.png" alt="Winter Cleanse lineup" style="width: 100%; height: 160px; object-fit: cover; border-radius: 999px; margin-top: 8px">
<div style="padding: 12px 6px 6px">
<h2 style="margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22.9px; line-height: 1.05; text-transform: none">{{featured.title}}</h2>
<p style="margin: 0 0 12px; color: #14261a">{{featured.preview}}</p>
<span style="display: block; text-align: center; background: #f6c744; color: #14261a; padding: 13px; border-radius: 999px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15.8px; letter-spacing: 0; text-transform: none">Read more</span>
</div>
</a>
<sc-for list="{{rest}}" as="b" hint-placeholder-count="3">
<a href="{{b.href}}" style="display: block; text-decoration: none; color: inherit; border-top: 2px solid #14261a; padding-top: 12px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 12.3px; letter-spacing: 0; text-transform: none; color: #4a5a4e">{{b.sentAt}}</div>
<h2 style="margin: 2px 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19.4px; text-transform: none">{{b.title}}</h2>
<p style="margin: 0; color: #4a5a4e">{{b.preview}}</p>
</a>
</sc-for>
</div>
<nav aria-label="App" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; border-top: 2px solid #14261a; padding: 8px 8px 14px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 14.1px; letter-spacing: 0; text-transform: none; text-align: center">
<a href="/mockups/juliansjuicebox/b/app" style="min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none">Order</a>
<a href="/mockups/juliansjuicebox/b/app/orders" style="min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none">My orders</a>
<a href="/mockups/juliansjuicebox/b/app/bulletins" aria-current="true" style="min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none; background: #14261a; color: #ffffff; border-radius: 999px">Bulletins</a>
<a href="/mockups/juliansjuicebox/b/app/account" style="min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none">Account</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var design = 'b';
var app = window.JJAppState ? window.JJAppState.load(design) : { readBulletins: {}, sentBulletins: [] };
var seed = [
{ id: 'b-seed-1', title: 'Winter Cleanse boxes are almost gone', preview: 'App family — you hear it first. Limited production, limited boxes. Order from the app before the website list opens.', sentAt: 'Today' },
{ id: 'b-seed-2', title: 'Our 36th Seasonal Cleanse is HERE!', preview: '24 organic cold-pressed juices, 3 immunity shots, and 1 free 8oz shot, shipped to your doorstep.', sentAt: 'Nov 10' },
{ id: 'b-seed-3', title: 'Strawberry Mylk is back', preview: 'Back on the Build A Box menu while it lasts.', sentAt: 'Nov 3' },
{ id: 'b-seed-4', title: 'Holiday shipping days', preview: 'Shipments go out Monday through Wednesday.', sentAt: 'Oct 28' }
];
var sent = (app.sentBulletins || []).slice().reverse().map(function (b) { return { id: b.id, title: b.title, preview: b.body, sentAt: b.sentAt }; });
var all = sent.concat(seed).map(function (b) { return Object.assign({}, b, { href: '/mockups/juliansjuicebox/b/app/bulletins/detail?id=' + b.id }); });
var featured = Object.assign({ tag: 'New · app first' }, all[0]);
var rest = all.slice(1);
return { featured: featured, rest: rest };
}
}
</script>
</body>
</html>
