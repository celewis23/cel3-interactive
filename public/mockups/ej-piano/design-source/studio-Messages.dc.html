<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio — Messages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&amp;family=Karla:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14213D}a:hover{color:#8A6516}
</style>
</helmet>
<div style="min-height: 100vh; background: #FBF8F1; color: #14213D; font-family: 'Karla', sans-serif; font-size: 15px; display: flex; flex-wrap: wrap">

<aside style="flex: 1 1 220px; background: #14213D; color: #FBF8F1; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 24px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #E9C46A; color: #14213D; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-weight: 700">E&amp;J</span><span style="font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 20px">Studio</span></div>
<a href="studio-Dashboard.dc.html" style="text-decoration: none; color: #FBF8F1; padding: 12px; border-radius: 10px">Today</a>
<a href="studio-Students.dc.html" style="text-decoration: none; color: #FBF8F1; padding: 12px; border-radius: 10px">Students</a>
<a href="studio-Schedule.dc.html" style="text-decoration: none; color: #FBF8F1; padding: 12px; border-radius: 10px">Schedule</a>
<a href="studio-Live.dc.html" style="text-decoration: none; color: #FBF8F1; padding: 12px; border-radius: 10px">Live session</a>
<a href="studio-Feed.dc.html" style="text-decoration: none; color: #FBF8F1; padding: 12px; border-radius: 10px">Studio feed</a>
<a href="studio-Messages.dc.html" style="text-decoration: none; color: #FBF8F1; padding: 12px; border-radius: 10px; background: #24324F">Messages</a>
<a href="studio-Billing.dc.html" style="text-decoration: none; color: #FBF8F1; padding: 12px; border-radius: 10px">Billing</a>
</aside>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-wrap: wrap; min-height: 960px">

<section style="flex: 1 1 300px; min-width: 0; border-right: 1px solid #E6DFD0; background: #FFFFFF; display: flex; flex-direction: column">
<div style="padding: 24px 20px 12px; display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 36px">Messages</h1>
<button type="button" style="font: inherit; font-weight: 700; font-size: 14px; background: #14213D; color: #FBF8F1; border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer">Announcement</button>
</div>
<sc-for list="{{convos}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.sel}}" style="font: inherit; text-align: left; display: flex; gap: 12px; align-items: center; padding: 14px 20px; border: none; border-top: 1px solid #F1ECE1; background: {{c.bg}}; color: #14213D; cursor: pointer">
<span style="width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; background: {{c.color}}; color: #FBF8F1; display: flex; align-items: center; justify-content: center; font-weight: 700">{{c.i}}</span>
<span style="flex: 1; min-width: 0"><span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 700">{{c.name}}</span><span style="font-size: 12px; color: #5B6170">{{c.when}}</span></span><span style="display: block; font-size: 14px; color: #4A5062; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span></span>
<sc-if value="{{c.unread}}" hint-placeholder-val="{{ false }}"><span style="width: 10px; height: 10px; border-radius: 50%; background: #C2410C; flex: 0 0 auto"></span></sc-if>
</button>
</sc-for>
</section>

<section style="flex: 3 1 420px; min-width: 0; display: flex; flex-direction: column">
<div style="padding: 20px 24px; border-bottom: 1px solid #E6DFD0; background: #FFFFFF; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div><div style="font-weight: 700; font-size: 18px">{{active.name}}</div><div style="font-size: 13px; color: #5B6170">{{active.sub}}</div></div>
<a href="studio-Live.dc.html" style="font-weight: 700; font-size: 14px; text-decoration: none; border: 1.5px solid #14213D; border-radius: 999px; padding: 9px 16px">Video call</a>
</div>
<div style="flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end">
<sc-for list="{{thread}}" as="m" hint-placeholder-count="4">
<div style="align-self: {{m.align}}; max-width: 70%; background: {{m.bg}}; color: {{m.fg}}; border: 1px solid {{m.bd}}; border-radius: 18px; padding: 10px 16px">{{m.text}}</div>
</sc-for>
</div>
<div style="padding: 0 24px 8px; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
<button type="button" onClick="{{q.use}}" style="font: inherit; font-size: 13px; font-weight: 700; background: #EFE8D8; color: #14213D; border: none; border-radius: 999px; padding: 8px 12px; cursor: pointer">{{q.text}}</button>
</sc-for>
</div>
<form onSubmit="{{send}}" style="display: flex; gap: 10px; padding: 12px 24px 24px">
<label for="studiomsg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
<input id="studiomsg" type="text" value="{{draft}}" onChange="{{onDraft}}" placeholder="Write a message…" style="flex: 1; min-width: 0; font: inherit; padding: 14px 18px; border: 1px solid #CFC6B3; border-radius: 999px; background: #FFFFFF">
<button type="submit" style="font: inherit; font-weight: 700; background: #14213D; color: #FBF8F1; border: none; border-radius: 999px; padding: 0 24px; min-height: 48px; cursor: pointer">Send</button>
</form>
</section>

<aside style="flex: 1 1 260px; min-width: 0; border-left: 1px solid #E6DFD0; padding: 24px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #8A6516">FAMILY DETAILS</div>
<sc-for list="{{active.kids}}" as="k" hint-placeholder-count="1">
<a href="studio-Student.dc.html" style="text-decoration: none; background: #FFFFFF; border: 1px solid #E6DFD0; border-radius: 14px; padding: 14px; display: block">
<span style="display: block; font-weight: 700">{{k.name}}</span>
<span style="display: block; font-size: 13px; color: #5B6170">{{k.detail}}</span>
</a>
</sc-for>
<div style="background: #FFFFFF; border: 1px solid #E6DFD0; border-radius: 14px; padding: 14px">
<div style="font-size: 13px; color: #5B6170">October tuition</div>
<div style="font-weight: 700">{{active.tuition}}</div>
</div>
<a href="studio-Billing.dc.html" style="font-weight: 700; font-size: 14px">View billing</a>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0, draft: '', extra: {} }; }
  renderVals() {
    var self = this, sel = this.state.sel;
    var data = [
      { name: 'Rivera family', i: 'R', color: '#8A6516', when: '2:14 PM', unread: true, sub: 'Ana Rivera · parent of Maya & Leo', tuition: 'Due Oct 15',
        kids: [{ name: 'Maya Rivera', detail: 'Level 3 · Tue 4:30' }, { name: 'Leo Rivera', detail: 'Level 1 · Tue 5:00' }],
        thread: [['them', 'Hi! Maya has a school concert Tuesday. Could we move her lesson to Thursday this week?'], ['me', 'Of course! Thursday at 4:30 is open.'], ['them', 'Thank you so much! Also, Leo says he loves the new song.']] },
      { name: 'Chen family', i: 'C', color: '#6B4E71', when: '11:02 AM', unread: true, sub: 'Grace Chen · parent of Ava', tuition: 'Paid Oct 1 · autopay',
        kids: [{ name: 'Ava Chen', detail: 'Level 5 · Fri 3:30 online' }],
        thread: [['them', 'Ava recorded the B section, sending it now for you to hear before today.'], ['them', 'Is the recital piece still due by November?']] },
      { name: 'All families', i: 'All', color: '#14213D', when: 'Mon', unread: false, sub: 'Announcement · 18 families', tuition: '15 of 18 paid',
        kids: [],
        thread: [['me', 'Fall recital sign-ups are open! RSVP in the app by Oct 20.']] },
      { name: 'Grant family', i: 'G', color: '#7A3E2E', when: 'Sun', unread: false, sub: 'Nia Grant · parent of Sofia', tuition: 'Overdue · September',
        kids: [{ name: 'Sofia Grant', detail: 'Level 4 · Fri 5:30 online' }],
        thread: [['them', 'Can Sofia do her lesson online this week? We are traveling.'], ['me', 'Yes, I switched it. See you on video Friday!']] },
      { name: 'Brooks family', i: 'B', color: '#2F5D50', when: 'Oct 3', unread: false, sub: 'Tasha Brooks · parent of Ella & Caleb', tuition: 'Due Oct 15',
        kids: [{ name: 'Ella Brooks', detail: 'Level 1 · Fri 4:30' }, { name: 'Caleb Brooks', detail: 'Level 2 · Wed 4:30' }],
        thread: [['them', 'Caleb finished his whole practice chart this week!'], ['me', 'That is amazing. Sticker time on Wednesday!']] }
    ];
    var extra = this.state.extra;
    var cur = data[sel];
    var thread = cur.thread.concat((extra[sel] || []).map(function (t) { return ['me', t]; }));
    var send = function (text) {
      var t = (text || '').trim(); if (!t) return;
      var e = Object.assign({}, self.state.extra); e[sel] = (e[sel] || []).concat([t]);
      self.setState({ extra: e, draft: '' });
    };
    return {
      convos: data.map(function (c, i) {
        var last = (extra[i] && extra[i].length) ? extra[i][extra[i].length - 1] : c.thread[c.thread.length - 1][1];
        return { name: c.name, i: c.i, color: c.color, when: c.when, preview: last, unread: c.unread && i !== sel,
          sel: i === sel, bg: i === sel ? '#F6EBCB' : '#FFFFFF', pick: function () { self.setState({ sel: i, draft: '' }); } };
      }),
      active: cur,
      thread: thread.map(function (m) {
        var me = m[0] === 'me';
        return { text: m[1], align: me ? 'flex-end' : 'flex-start', bg: me ? '#14213D' : '#FFFFFF', fg: me ? '#FBF8F1' : '#14213D', bd: me ? '#14213D' : '#E6DFD0' };
      }),
      quick: ['Sounds good!', 'Great practicing this week!', 'See you at your lesson.'].map(function (q) { return { text: q, use: function () { send(q); } }; }),
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: (e) => { e.preventDefault(); send(this.state.draft); }
    };
  }
}
</script>
</body>
</html>
