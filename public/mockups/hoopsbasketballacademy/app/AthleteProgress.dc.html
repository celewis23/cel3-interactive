<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.d{font-family:'Archivo',sans-serif;font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.9}
.m{font-family:'JetBrains Mono',monospace}
.k{font-size:11px;font-weight:800;letter-spacing:.12em}
.tb{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 11px 'Inter';text-decoration:none;min-width:58px;padding-top:10px}

summary::-webkit-details-marker{display:none}
summary{list-style:none}
@media (max-width: 640px){
.sp{padding-left:20px!important;padding-right:20px!important}
.sv{padding-top:64px!important;padding-bottom:64px!important}
.panel{padding:24px!important}
.mp{padding:16px!important}
.hide-m{display:none!important}
.scroll-m{flex-wrap:nowrap!important;overflow-x:auto!important}
.tabs-m{flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;padding-bottom:4px}
.tabs-m .tab{width:auto!important;white-space:nowrap;flex:none!important;min-height:52px!important}
.img-m{height:240px!important}
.navroot{min-height:0!important;padding:12px 14px!important}
}
@media (min-width: 641px){.show-m{display:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; font-family: 'Inter', sans-serif; color: #FFFFFF; background: #00103F; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 24px 16px 0">
<div style="border-radius: 24px; background: #FFFFFF; color: #0B1530; padding: 8px">
<div style="border-radius: 18px; background: #012169; color: #FFFFFF; padding: 18px; position: relative; overflow: hidden; height: 170px">
<span class="d" style="position: absolute; right: 12px; top: 2px; font-size: 140px; color: #0A2C7A">23</span>
<div style="position: relative"><div class="k" style="color: #8FB8FF">DEVELOPMENT · GUARD</div><div class="d" style="font-size: 44px; margin-top: 8px">Malik<br>Carter</div></div>
<div style="position: absolute; right: 16px; bottom: 14px; text-align: right"><div class="d" style="font-size: 52px; color: #FF6A13">78</div><div class="k" style="font-size: 9px; color: #B7C3E0">OVERALL · +3</div></div>
</div>
<div style="padding: 14px 10px 8px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{skills}}" as="s" hint-placeholder-count="6"><div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700"><span style="width: 74px">{{s.n}}</span><span style="flex: 1; height: 8px; border-radius: 4px; background: #E3E9F5; overflow: hidden"><span style="display: block; height: 100%; width: {{s.w}}; background: #00539B"></span></span><span class="m" style="width: 24px; text-align: right">{{s.v}}</span><span class="m" style="width: 26px; font-size: 11px; color: #00539B">+{{s.d}}</span></div></sc-for>
</div>
</div>
</div>
<div style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="border-radius: 18px; background: #012169; padding: 16px">
<div class="k" style="color: #B7C3E0">FREE THROWS · % BY WEEK</div>
<div style="display: flex; align-items: flex-end; gap: 6px; height: 100px; margin-top: 12px">
<sc-for list="{{ft}}" as="p" hint-placeholder-count="8"><span style="flex: 1; height: {{p.h}}; background: {{p.c}}; border-radius: 4px 4px 0 0"></span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #B7C3E0; font-weight: 600"><span>Sep</span><span style="color: #FF6A13; font-weight: 800">76% now</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="border-radius: 16px; background: #012169; padding: 14px"><div class="k" style="color: #B7C3E0">WORKOUTS DONE</div><div class="d" style="font-size: 36px; margin-top: 6px">31</div></div>
<div style="border-radius: 16px; background: #012169; padding: 14px"><div class="k" style="color: #B7C3E0">SESSIONS</div><div class="d" style="font-size: 36px; margin-top: 6px">44</div></div>
</div>
</div>
<nav style="background: #012169; display: flex; justify-content: space-around; align-items: flex-start; padding-bottom: 22px" aria-label="App">

<a class="tb" href="AthleteWorkout.dc.html" style="color: #B7C3E0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"></path></svg>Workouts</a>
<a href="AthleteCheckin.dc.html" aria-label="Scan to check in" style="width: 62px; height: 62px; margin-top: -18px; border-radius: 50%; background: #FF6A13; color: #0B1530; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px #00103F"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M3 7V3h4M17 3h4v4M21 17v4h-4M7 21H3v-4M7 12h10"></path></svg></a>
<a class="tb" href="AthleteProgress.dc.html" style="color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Progress</a>
<a class="tb" href="ParentMessages.dc.html" style="color: #B7C3E0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"></path></svg>Coach</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ftv = [58,61,60,66,64,70,72,76];
    return {
      skills: [['Handle',82,4],['Shooting',76,5],['Finishing',81,6],['Footwork',79,2],['Defense',74,1],['IQ',80,3]].map(([n,v,d]) => ({ n, v, d, w: v+'%' })),
      ft: ftv.map((v,i) => ({ h: (v-40)*2.6+'px', c: i===7 ? '#FF6A13' : '#00539B' }))
    };
  }
}
</script>
</body>
