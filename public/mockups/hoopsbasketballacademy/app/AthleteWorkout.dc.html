<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/hoopsbasketballacademy/app/">
<script src="/mockups/hoopsbasketballacademy/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/hoopsbasketballacademy/phone-frame.js" defer></script>
<title>Athlete app — Workout player</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.d{font-family:'Archivo',sans-serif;font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.9}
.m{font-family:'JetBrains Mono',monospace}
.k{font-size:11px;font-weight:800;letter-spacing:.12em}
.b{border:0;cursor:pointer;font:800 15px 'Inter',sans-serif;border-radius:16px;min-height:54px;display:flex;align-items:center;justify-content:center;gap:8px}

summary::-webkit-details-marker{display:none}
summary{list-style:none}
@media (max-width: 640px){
.sp{padding-left:20px!important;padding-right:20px!important}
.sv{padding-top:64px!important;padding-bottom:64px!important}
.panel{padding:24px!important}
.mp{padding:16px!important}
.hide-m{display:none!important}
.scroll-m{flex-wrap:nowrap!important;overflow-x:auto!important}
.tabs-m{flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;padding-bottom:4px}
.tabs-m .tab{width:auto!important;white-space:nowrap;flex:none!important;min-height:52px!important}
.img-m{height:240px!important}
.navroot{min-height:0!important;padding:12px 14px!important}
}
@media (min-width: 641px){.show-m{display:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; font-family: 'Inter', sans-serif; color: #FFFFFF; background: #00103F; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 20px 16px 10px; display: flex; align-items: center; gap: 10px">
<a href="AthleteToday.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; background: #012169; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex: 1"><div class="k" style="color: #8FB8FF">HOMEWORK · DUE SUN</div><div style="font-weight: 800; font-size: 16px; margin-top: 2px">Left-hand finishing package</div></div>
</div>
<div style="display: flex; gap: 4px; padding: 0 16px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4"><span style="flex: 1; height: 5px; border-radius: 3px; background: {{b}}"></span></sc-for>
</div>

<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 190px; border-radius: 20px; background: #00539B; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden">
<svg viewBox="0 0 360 190" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><g stroke="#2E6FB0" stroke-width="2" fill="none"><path d="M100 0 V110 H260 V0"></path><circle cx="180" cy="110" r="50"></circle></g></svg>
<span style="position: relative; width: 62px; height: 62px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="#012169" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></span>
<span class="k" style="position: absolute; left: 14px; bottom: 12px; color: #CFE0FF">COACH DEMO · 0:42</span>
</div>
<div>
<div class="k" style="color: #8FB8FF">DRILL {{num}} OF {{count}}</div>
<div class="d" style="font-size: 36px; margin-top: 6px">{{cur.name}}</div>
<div style="font-size: 14px; color: #D6DEF0; margin-top: 6px">{{cur.reps}}</div>
</div>
<div style="display: flex; align-items: center; gap: 18px; padding: 14px; border-radius: 18px; background: #012169">
<svg width="96" height="96" viewBox="0 0 100 100" role="img" aria-label="Time left {{clock}}"><circle cx="50" cy="50" r="42" stroke="#0A2C7A" stroke-width="10" fill="none"></circle><circle cx="50" cy="50" r="42" stroke="#FF6A13" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="{{dash}}" transform="rotate(-90 50 50)"></circle></svg>
<div style="flex: 1"><div class="m" style="font-size: 40px; font-weight: 700">{{clock}}</div><div style="font-size: 12px; color: #B7C3E0; font-weight: 600">{{runLabel}}</div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{cur.cues}}" as="c" hint-placeholder-count="2"><div style="display: flex; gap: 10px; font-size: 13px; color: #D6DEF0; font-weight: 600"><span style="color: #FF6A13">•</span>{{c}}</div></sc-for>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button class="b" onClick="{{toggle}}" style="background: #012169; color: #FFFFFF; box-shadow: inset 0 0 0 2px #2E6FB0">{{toggleLabel}}</button>
<button class="b" onClick="{{markDone}}" style="background: #FF6A13; color: #0B1530">{{doneLabel}}</button>
</div>
</div>
</sc-if>

<sc-if value="{{finished}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; padding: 30px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center; gap: 14px">
<div style="width: 104px; height: 104px; border-radius: 50%; background: #FF6A13; display: flex; align-items: center; justify-content: center"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#012169" stroke-width="3.5" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg></div>
<div class="d" style="font-size: 60px">Workout<br>complete</div>
<div style="color: #D6DEF0; font-size: 15px; line-height: 1.5">22 minutes in. Coach and your parents can see it's done.</div>
<label style="width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; margin-top: 8px">Note for Coach (optional)<input placeholder="How did it feel?" style="min-height: 48px; border-radius: 14px; border: 0; padding: 0 14px; font: 500 14px 'Inter'"></label>
<button class="b" onClick="{{reset}}" style="background: #012169; color: #FFFFFF; width: 100%; box-shadow: inset 0 0 0 2px #2E6FB0">Run it again</button>
<a href="AthleteToday.dc.html" class="b" style="background: #FFFFFF; color: #012169; width: 100%; text-decoration: none">Back to today</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.D = [
    { name:'Mikan drill, left side', reps:'2 sets · 30 makes each', sec:240, cues:['Left hand, high off the glass','Stay under the rim, no extra dribbles'] },
    { name:'Left-hand layup lines', reps:'20 makes from the wing', sec:300, cues:['Right knee up on the takeoff','Protect the ball with your body'] },
    { name:'Reverse layups', reps:'15 makes, both sides', sec:300, cues:['Use the rim to protect the shot','Spin it soft off the glass'] },
    { name:'Euro step finishes', reps:'10 each direction', sec:480, cues:['Long first step, sell it','Eyes on the rim the whole time'] }
  ]; this.state = { i: 0, done: [], left: 240, run: false, fin: false }; }
  componentDidMount(){ this.t = setInterval(() => { if (this.state.run && this.state.left > 0) this.setState({ left: this.state.left - 1 }); }, 1000); }
  componentWillUnmount(){ clearInterval(this.t); }
  renderVals() {
    const s = this.state; const cur = this.D[s.i];
    const C = 2*Math.PI*42; const frac = s.left / cur.sec;
    const mm = Math.floor(s.left/60), ss = String(s.left%60).padStart(2,'0');
    const bars = this.D.map((_,k) => s.done.includes(k) ? '#FF6A13' : k===s.i ? '#FFFFFF' : '#0A2C7A');
    const last = s.i === this.D.length - 1;
    return {
      cur, num: s.i+1, count: this.D.length, bars, clock: mm+':'+ss, dash: (C*frac)+' '+C,
      runLabel: s.run ? 'Running · stay locked in' : 'Tap start when you’re set',
      playing: !s.fin, finished: s.fin,
      toggle: () => this.setState({ run: !s.run }), toggleLabel: s.run ? 'Pause' : 'Start timer',
      doneLabel: last ? 'Finish workout' : 'Drill done',
      markDone: () => { const done = [...s.done, s.i]; if (last) this.setState({ done, fin: true, run: false }); else this.setState({ done, i: s.i+1, left: this.D[s.i+1].sec, run: false }); },
      reset: () => this.setState({ i: 0, done: [], left: this.D[0].sec, run: false, fin: false })
    };
  }
}
</script>
</body>
</html>
