<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/hoopsbasketballacademy/app/">
<script src="/mockups/hoopsbasketballacademy/preview-chrome.js" data-section="app" defer></script>
<script src="/mockups/hoopsbasketballacademy/phone-frame.js" defer></script>
<title>Athlete app — Scan to check in</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.d{font-family:'Archivo',sans-serif;font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.9}
.k{font-size:11px;font-weight:800;letter-spacing:.12em}
.b{border:0;cursor:pointer;font:800 15px 'Inter',sans-serif;border-radius:16px;min-height:54px;display:flex;align-items:center;justify-content:center;width:100%;text-decoration:none}
@keyframes sweep{0%{top:12%}50%{top:84%}100%{top:12%}}

summary::-webkit-details-marker{display:none}
summary{list-style:none}
@media (max-width: 640px){
.sp{padding-left:20px!important;padding-right:20px!important}
.sv{padding-top:64px!important;padding-bottom:64px!important}
.panel{padding:24px!important}
.mp{padding:16px!important}
.hide-m{display:none!important}
.scroll-m{flex-wrap:nowrap!important;overflow-x:auto!important}
.tabs-m{flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;padding-bottom:4px}
.tabs-m .tab{width:auto!important;white-space:nowrap;flex:none!important;min-height:52px!important}
.img-m{height:240px!important}
.navroot{min-height:0!important;padding:12px 14px!important}
}
@media (min-width: 641px){.show-m{display:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; font-family: 'Inter', sans-serif; color: #FFFFFF; background: #05070D; display: flex; flex-direction: column; overflow: hidden; position: relative">
<sc-if value="{{scanning}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; background: #1B2233"></div>
<svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><g stroke="#2A3550" stroke-width="3" fill="none"><path d="M-20 640 L410 560"></path><path d="M60 844 L140 560"></path><path d="M330 844 L260 560"></path></g><rect x="95" y="230" width="200" height="200" rx="10" fill="#E9EDF5"></rect></svg>
<div style="position: absolute; left: 115px; top: 250px; display: grid; grid-template-columns: repeat(9, 17px); gap: 1px">
<sc-for list="{{qr}}" as="q" hint-placeholder-count="81"><span style="width: 17px; height: 17px; background: {{q}}"></span></sc-for>
</div>
<div style="position: absolute; left: 65px; top: 200px; width: 260px; height: 260px">
<span style="position: absolute; left: 0; top: 0; width: 46px; height: 46px; border-left: 5px solid #FF6A13; border-top: 5px solid #FF6A13; border-radius: 14px 0 0 0"></span>
<span style="position: absolute; right: 0; top: 0; width: 46px; height: 46px; border-right: 5px solid #FF6A13; border-top: 5px solid #FF6A13; border-radius: 0 14px 0 0"></span>
<span style="position: absolute; left: 0; bottom: 0; width: 46px; height: 46px; border-left: 5px solid #FF6A13; border-bottom: 5px solid #FF6A13; border-radius: 0 0 0 14px"></span>
<span style="position: absolute; right: 0; bottom: 0; width: 46px; height: 46px; border-right: 5px solid #FF6A13; border-bottom: 5px solid #FF6A13; border-radius: 0 0 14px 0"></span>
<span style="position: absolute; left: 14px; right: 14px; height: 3px; background: #FF6A13; box-shadow: 0 0 16px #FF6A13; animation: sweep 2.4s ease-in-out infinite"></span>
</div>
<div style="position: relative; padding: 22px 16px; display: flex; justify-content: space-between; align-items: center">
<a href="AthleteToday.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,.5); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span style="padding: 8px 14px; border-radius: 999px; background: rgba(0,0,0,.5); font-size: 13px; font-weight: 700">Guard skills · 6:00 PM</span>
</div>
<div style="position: relative; margin-top: auto; padding: 24px 20px 36px; background: #00103F; border-radius: 26px 26px 0 0">
<div class="d" style="font-size: 36px">Scan the gym code</div>
<div style="font-size: 14px; color: #D6DEF0; margin-top: 8px; line-height: 1.5">Point your camera at the code on the gym screen or by the door.</div>
<button class="b" onClick="{{scan}}" style="background: #FF6A13; color: #0B1530; margin-top: 18px">Simulate scan</button>
</div>
</sc-if>
<sc-if value="{{success}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; background: #012169; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 24px; gap: 14px">
<div style="width: 130px; height: 130px; border-radius: 50%; background: #FF6A13; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 14px #0A2C7A, 0 0 0 28px #00539B"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#012169" stroke-width="3.5" aria-hidden="true"><path d="M4 12l5 5L20 6"></path></svg></div>
<div class="k" style="color: #8FB8FF; margin-top: 28px">CHECKED IN · 5:58 PM</div>
<div class="d" style="font-size: 64px">You're in,<br>Malik.</div>
<div style="font-size: 15px; color: #D6DEF0">Guard skills · Court 1 · 75 min</div>
<div style="display: flex; gap: 10px; margin-top: 10px"><div style="padding: 12px 16px; border-radius: 14px; background: #0A2C7A"><div class="d" style="font-size: 30px; color: #FF6A13">13</div><div class="k" style="font-size: 9px; color: #B7C3E0">DAY STREAK</div></div><div style="padding: 12px 16px; border-radius: 14px; background: #0A2C7A"><div class="d" style="font-size: 30px">96%</div><div class="k" style="font-size: 9px; color: #B7C3E0">ATTENDANCE</div></div></div>
<div style="font-size: 13px; color: #B7C3E0; margin-top: 6px">Your parent got a check-in notice.</div>
<a class="b" href="AthleteToday.dc.html" style="background: #FFFFFF; color: #012169; margin-top: 16px">Done</a>
<button class="b" onClick="{{again}}" style="background: transparent; color: #B7C3E0; min-height: 44px">Scan again</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { ok: false }; }
  renderVals() {
    const pat = '111010111101001101111011111000100010110101101010001000111011111101100101111010111';
    return { qr: pat.padEnd(81,'0').slice(0,81).split('').map(c => c==='1' ? '#012169' : '#E9EDF5'), scanning: !this.state.ok, success: this.state.ok, scan: () => this.setState({ ok: true }), again: () => this.setState({ ok: false }) };
  }
}
</script>
</body>
</html>
