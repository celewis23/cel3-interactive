<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/hoopsbasketballacademy/console/">
<script src="/mockups/hoopsbasketballacademy/preview-chrome.js" data-section="console" defer></script>

<title>Hoops Console navigation</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.d{font-family:'Archivo',sans-serif;font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.88}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;text-decoration:none;font:600 14px 'Inter',sans-serif}
.nav:hover{background:#0A2C7A}

summary::-webkit-details-marker{display:none}
summary{list-style:none}
@media (max-width: 640px){
.sp{padding-left:20px!important;padding-right:20px!important}
.sv{padding-top:64px!important;padding-bottom:64px!important}
.panel{padding:24px!important}
.mp{padding:16px!important}
.hide-m{display:none!important}
.scroll-m{flex-wrap:nowrap!important;overflow-x:auto!important}
.tabs-m{flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;padding-bottom:4px}
.tabs-m .tab{width:auto!important;white-space:nowrap;flex:none!important;min-height:52px!important}
.img-m{height:240px!important}
.navroot{min-height:0!important;padding:12px 14px!important}
}
@media (min-width: 641px){.show-m{display:none!important}}
</style>
</helmet>
<div class="navroot" style="font-family: 'Inter', sans-serif; width: 100%; min-height: 1100px; height: 100%; background: #012169; color: #FFFFFF; padding: 22px 14px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<a href="AdminDashboard.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px; text-decoration: none; color: #FFFFFF">
<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#FF6A13"></circle><path d="M2 20h36M20 2v36M7 7c6 5 6 21 0 26M33 7c-6 5-6 21 0 26" stroke="#012169" stroke-width="2.2" fill="none"></path></svg>
<span><span class="d" style="font-size: 24px; display: block">Hoops</span><span style="font-size: 10px; letter-spacing: .2em; font-weight: 700; color: #8FB8FF">CONSOLE</span></span>
</a>
<button class="show-m" onClick="{{toggle}}" aria-expanded="{{open}}" style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #00539B; color: #FFFFFF; font: 700 14px 'Inter', sans-serif; align-items: center; gap: 8px; display: flex; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>{{menuLabel}}</button>
</div>
<div class="{{listCls}}" style="display: flex; flex-direction: column; gap: 22px; flex: 1">
<nav style="display: flex; flex-direction: column; gap: 4px" aria-label="Console">
<sc-for list="{{items}}" as="i" hint-placeholder-count="9">
<a class="nav" href="{{i.href}}" style="background: {{i.bg}}; color: {{i.fg}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"></path></svg>
<span style="flex: 1">{{i.label}}</span>
<sc-if value="{{i.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; border-radius: 11px; background: #FF6A13; color: #0B1530; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 6px">{{i.badge}}</span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
<div style="border-radius: 14px; background: #00539B; padding: 14px; font-size: 13px; line-height: 1.45">
<div style="font-weight: 800">Installed as an app</div>
<div style="color: #D6DEF0; margin-top: 4px">Push alerts on for new requests and messages.</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #FFFFFF; color: #012169; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px">CH</span>
<span style="font-size: 13px"><span style="display: block; font-weight: 700">Coach [Name]</span><span style="color: #B7C3E0">Owner</span></span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dash","req","ath","att","drills","inbox","bill","site","set"],"default":"dash"},"$preview":{"width":248,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'dash';
    const I = [
      ['dash','Dashboard','AdminDashboard.dc.html','M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z',''],
      ['req','Requests','AdminRequests.dc.html','M4 4h16v12H8l-4 4z','3'],
      ['ath','Athletes','AdminAthletes.dc.html','M16 20v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',''],
      ['att','Check-in & Attendance','AdminAttendance.dc.html','M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3z',''],
      ['drills','Drills & Workouts','AdminDrills.dc.html','M4 6h16M4 12h10M4 18h7M16 14l5 4-5 4z',''],
      ['inbox','Inbox','AdminInbox.dc.html','M3 13h5l2 3h4l2-3h5M5 5h14l2 8v6H3v-6z','5'],
      ['bill','Billing','AdminBilling.dc.html','M3 6h18v12H3zM3 10h18M7 15h4',''],
      ['site','Site Editor','AdminSiteEditor.dc.html','M3 4h18v13H3zM8 21h8M12 17v4',''],
      ['set','Settings','AdminSettings.dc.html','M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4','']
    ];
    const open = !!(this.state && this.state.open);
    return { open, toggle: () => this.setState({ open: !open }), menuLabel: open ? 'Close' : 'Menu', listCls: open ? '' : 'hide-m', items: I.map(([id,label,href,d,badge]) => ({ label, href, d, badge, hasBadge: !!badge, bg: id === a ? '#FFFFFF' : 'transparent', fg: id === a ? '#012169' : '#D6DEF0' })) };
  }
}
</script>
</body>
</html>
