<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/mockups/hoopsbasketballacademy/console/">
<script src="/mockups/hoopsbasketballacademy/preview-chrome.js" data-section="console" defer></script>

<title>Console — Visual Site Editor</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F6FB}
*{box-sizing:border-box}
.d{font-family:'Archivo',sans-serif;font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.9}
a{color:#00539B}a:hover{color:#012169}
.k{font-size:11px;font-weight:800;letter-spacing:.12em;color:#4A5675}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;font:700 13px 'Inter',sans-serif;text-decoration:none;border:0;cursor:pointer}
.sec{width:100%;display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;border:0;cursor:pointer;font:600 14px 'Inter',sans-serif;text-align:left}
.pv{display:block;width:100%;border:0;padding:0;cursor:pointer;text-align:left;font-family:'Inter',sans-serif;position:relative}
.inp{width:100%;min-height:44px;border-radius:10px;border:2px solid #DCE3F0;padding:0 12px;font:500 14px 'Inter',sans-serif}
.sw{width:40px;height:40px;border-radius:10px;border:0;cursor:pointer}

summary::-webkit-details-marker{display:none}
summary{list-style:none}
@media (max-width: 640px){
.sp{padding-left:20px!important;padding-right:20px!important}
.sv{padding-top:64px!important;padding-bottom:64px!important}
.panel{padding:24px!important}
.mp{padding:16px!important}
.hide-m{display:none!important}
.scroll-m{flex-wrap:nowrap!important;overflow-x:auto!important}
.tabs-m{flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;padding-bottom:4px}
.tabs-m .tab{width:auto!important;white-space:nowrap;flex:none!important;min-height:52px!important}
.img-m{height:240px!important}
.navroot{min-height:0!important;padding:12px 14px!important}
}
@media (min-width: 641px){.show-m{display:none!important}}
</style>
</helmet>
<div style="font-family: 'Inter', sans-serif; color: #0B1530; background: #F3F6FB; width: 100%; min-height: 1100px; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 248px; max-width: 100%"><dc-import name="AdminNav" active="site" hint-size="100%,1100px"></dc-import></div>
<main class="mp" style="flex: 999 1 560px; min-width: 0; padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 14px">
<!-- toolbar -->
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #FFFFFF; border-radius: 14px; padding: 8px 10px; box-shadow: 0 1px 0 #DCE3F0">
<div style="display: flex; gap: 4px; flex-wrap: wrap">
<sc-for list="{{pages}}" as="p" hint-placeholder-count="5"><button class="btn" onClick="{{p.pick}}" style="background: {{p.bg}}; color: {{p.fg}}">{{p.t}}</button></sc-for>
</div>
<div style="display: flex; gap: 4px; background: #F3F6FB; border-radius: 10px; padding: 3px; margin-left: auto">
<sc-for list="{{devices}}" as="d" hint-placeholder-count="3"><button class="btn" onClick="{{d.pick}}" aria-label="{{d.t}} preview" style="background: {{d.bg}}; color: {{d.fg}}; min-height: 34px">{{d.t}}</button></sc-for>
</div>
<button class="btn" style="background: #F3F6FB; color: #012169">Undo</button>
<a class="btn" href="Main.dc.html" style="background: #F3F6FB; color: #012169">Preview</a>
<button class="btn" onClick="{{publish}}" style="background: {{pubBg}}; color: {{pubFg}}">{{pubLabel}}</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; flex: 1">
<!-- sections -->
<div style="flex: 1 1 210px; background: #FFFFFF; border-radius: 16px; padding: 12px; box-shadow: 0 1px 0 #DCE3F0">
<div class="k" style="padding: 4px 6px 10px">SECTIONS · {{pageName}}</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="8"><button class="sec" onClick="{{s.pick}}" style="background: {{s.bg}}; color: {{s.fg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="opacity: .5"><circle cx="9" cy="6" r="2"></circle><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="15" cy="12" r="2"></circle><circle cx="9" cy="18" r="2"></circle><circle cx="15" cy="18" r="2"></circle></svg>{{s.t}}</button></sc-for>
</div>
<div class="k" style="padding: 18px 6px 8px">ADD A BLOCK</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<button class="btn" style="background: #F3F6FB; color: #012169">Text</button><button class="btn" style="background: #F3F6FB; color: #012169">Image</button>
<button class="btn" style="background: #F3F6FB; color: #012169">Gallery</button><button class="btn" style="background: #F3F6FB; color: #012169">Video</button>
<button class="btn" style="background: #F3F6FB; color: #012169">Legends</button><button class="btn" style="background: #F3F6FB; color: #012169">Scores</button>
<button class="btn" style="background: #F3F6FB; color: #012169">Form</button><button class="btn" style="background: #F3F6FB; color: #012169">FAQ</button>
</div>
</div>

<!-- canvas -->
<div style="flex: 999 1 460px; min-width: 0; background: #DCE3F0; border-radius: 16px; padding: 22px; display: flex; justify-content: center; min-height: 860px">
<div style="width: {{frameW}}; max-width: 100%; background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(1,33,105,.18); align-self: flex-start">
<div style="background: #012169; color: #FFFFFF; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700"><span class="d" style="font-size: 18px">Hoops</span><span style="opacity: .8">Programs · Legends · League · About</span></div>
<button class="pv" onClick="{{selHero}}" style="background: {{heroBg}}; color: {{heroFg}}; padding: {{heroPad}}; box-shadow: {{ringHero}}">
<span style="display: block; font-size: 10px; font-weight: 800; letter-spacing: .14em; opacity: .8">NOW ENROLLING · WINTER SESSION</span>
<span class="d" style="display: block; font-size: {{heroSize}}; margin-top: 10px; white-space: pre-line">{{headline}}</span>
<span style="display: block; font-size: 13px; margin-top: 10px; opacity: .85; max-width: 380px">{{sub}}</span>
<span style="display: inline-block; margin-top: 14px; padding: 10px 16px; border-radius: 999px; background: #FF6A13; color: #0B1530; font-size: 12px; font-weight: 800">{{cta}}</span>
</button>
<button class="pv" onClick="{{selTicker}}" style="background: #FF6A13; color: #0B1530; padding: 10px 16px; font-size: 11px; font-weight: 800; box-shadow: {{ringTicker}}">3X3 FINAL · BLUE CHIPS 21 — GLASS CLEANERS 17</button>
<button class="pv" onClick="{{selSystem}}" style="background: #FFFFFF; padding: 22px 16px; box-shadow: {{ringSystem}}">
<span class="d" style="display: block; font-size: 30px; color: #012169">The Hoops system</span>
<span style="display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap"><span style="padding: 7px 10px; border-radius: 8px; background: #012169; color: #FFFFFF; font-size: 11px; font-weight: 700">Skill training</span><span style="padding: 7px 10px; border-radius: 8px; background: #F3F6FB; font-size: 11px; font-weight: 700">Homework</span><span style="padding: 7px 10px; border-radius: 8px; background: #F3F6FB; font-size: 11px; font-weight: 700">Progress</span><span style="padding: 7px 10px; border-radius: 8px; background: #F3F6FB; font-size: 11px; font-weight: 700">Scan-in</span></span>
<span style="display: block; height: 90px; border-radius: 10px; background: #012169; margin-top: 10px"></span>
</button>
<button class="pv" onClick="{{selLegends}}" style="background: #012169; color: #FFFFFF; padding: 22px 16px; box-shadow: {{ringLegends}}">
<span class="d" style="display: block; font-size: 30px">Hoops <span style="color: #FF6A13">Legends</span></span>
<span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 12px"><span style="height: 80px; border-radius: 8px; background: #00539B"></span><span style="height: 80px; border-radius: 8px; background: #00539B"></span><span style="height: 80px; border-radius: 8px; background: #00539B"></span></span>
</button>
<button class="pv" onClick="{{selCta}}" style="background: #FF6A13; color: #0B1530; padding: 22px 16px; box-shadow: {{ringCta}}"><span class="d" style="font-size: 30px">Next up: your kid.</span></button>
</div>
</div>

<!-- properties -->
<div style="flex: 1 1 260px; background: #FFFFFF; border-radius: 16px; padding: 16px; box-shadow: 0 1px 0 #DCE3F0; display: flex; flex-direction: column; gap: 14px">
<div><div class="k">EDITING</div><div class="d" style="font-size: 28px; color: #012169; margin-top: 6px">{{selName}}</div></div>
<sc-if value="{{isHero}}" hint-placeholder-val="{{ true }}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Headline<textarea class="inp" onInput="{{setHeadline}}" style="min-height: 84px; padding: 10px 12px; resize: vertical">{{headline}}</textarea></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; margin-top: 12px">Subheading<textarea class="inp" onInput="{{setSub}}" style="min-height: 70px; padding: 10px 12px; resize: vertical">{{sub}}</textarea></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; margin-top: 12px">Button label<input class="inp" value="{{cta}}" onInput="{{setCta}}"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; margin-top: 12px">Button links to<select class="inp"><option>Request a workout</option><option>3x3 League</option><option>Hoops Legends</option></select></label>
<div style="font-size: 13px; font-weight: 700; margin-top: 12px">Background</div>
<div style="display: flex; gap: 8px; margin-top: 6px">
<sc-for list="{{swatches}}" as="w" hint-placeholder-count="4"><button class="sw" onClick="{{w.pick}}" aria-label="{{w.n}}" style="background: {{w.c}}; box-shadow: {{w.ring}}"></button></sc-for>
</div>
<div style="font-size: 13px; font-weight: 700; margin-top: 12px">Background image</div>
<button class="btn" style="background: #F3F6FB; color: #012169; width: 100%; margin-top: 6px; min-height: 64px; border: 2px dashed #B7C3E0">Upload or choose from media</button>
</sc-if>
<sc-if value="{{notHero}}" hint-placeholder-val="{{ false }}">
<div style="padding: 14px; border-radius: 12px; background: #F3F6FB; font-size: 14px; line-height: 1.5; color: #33405F">{{selHelp}}</div>
<label style="display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700">Show on page<input type="checkbox" checked="" style="width: 20px; height: 20px; accent-color: #00539B"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Section title<input class="inp" value="{{selName}}"></label>
</sc-if>
<div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #E3E9F5; display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">SEO title<input class="inp" value="Hoops Basketball Academy | Youth Basketball Training"></label>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { page: 'Home', dev: 'Desktop', sel: 'hero', bg: '#012169', headline: 'Where hoopers\nget made.', sub: 'Skill training, a real 3-on-3 league, and an app that keeps everyone on the same page.', cta: 'Request a workout', pub: false }; }
  renderVals() {
    const s = this.state;
    const on = b => b ? { bg: '#012169', fg: '#FFFFFF' } : { bg: 'transparent', fg: '#33405F' };
    const pages = ['Home','Request','Legends','League','About'].map(t => ({ t, ...on(s.page===t), pick: () => this.setState({ page: t }) }));
    const devices = ['Desktop','Tablet','Phone'].map(t => ({ t, ...on(s.dev===t), pick: () => this.setState({ dev: t }) }));
    const SEC = [['hero','Hero'],['ticker','Score ticker'],['system','The Hoops system'],['ages','Age picker'],['how','How it works'],['app','App showcase'],['legends','Legends preview'],['cta','Call to action']];
    const help = { ticker:'Pulls final scores from the League automatically. Nothing to type.', system:'Six feature tabs. Edit each tab’s title, copy and bullet points.', ages:'Programs come from Settings › Programs, so prices stay in sync.', how:'Four steps. Edit the step titles and descriptions.', app:'Shows the Hoops app. Toggle parent and athlete cards.', legends:'Shows the three newest Legends. Add Legends from the Legends page.', cta:'Closing banner with a button to Request a workout.' };
    const sections = SEC.map(([id,t]) => ({ t, ...(s.sel===id ? { bg:'#E3ECFA', fg:'#012169' } : { bg:'transparent', fg:'#0B1530' }), pick: () => this.setState({ sel: id }) }));
    const ring = id => s.sel===id ? 'inset 0 0 0 3px #FF6A13' : 'none';
    const dark = s.bg !== '#FFFFFF';
    const W = { Desktop:'100%', Tablet:'620px', Phone:'340px' }[s.dev];
    const swatches = [['Navy','#012169'],['Royal','#00539B'],['White','#FFFFFF'],['Ink','#0B1530']].map(([n,c]) => ({ n, c, ring: s.bg===c ? '0 0 0 3px #FFFFFF, 0 0 0 5px #FF6A13' : 'inset 0 0 0 1px #DCE3F0', pick: () => this.setState({ bg: c }) }));
    return {
      pages, devices, sections, swatches, pageName: s.page.toUpperCase(),
      frameW: W, heroBg: s.bg, heroFg: dark ? '#FFFFFF' : '#012169', heroPad: s.dev==='Phone' ? '26px 16px' : '40px 28px', heroSize: s.dev==='Phone' ? '40px' : '58px',
      headline: s.headline, sub: s.sub, cta: s.cta,
      setHeadline: e => this.setState({ headline: e.target.value, pub: false }), setSub: e => this.setState({ sub: e.target.value, pub: false }), setCta: e => this.setState({ cta: e.target.value, pub: false }),
      ringHero: ring('hero'), ringTicker: ring('ticker'), ringSystem: ring('system'), ringLegends: ring('legends'), ringCta: ring('cta'),
      selHero: () => this.setState({ sel: 'hero' }), selTicker: () => this.setState({ sel: 'ticker' }), selSystem: () => this.setState({ sel: 'system' }), selLegends: () => this.setState({ sel: 'legends' }), selCta: () => this.setState({ sel: 'cta' }),
      selName: SEC.find(x => x[0]===s.sel)[1], isHero: s.sel==='hero', notHero: s.sel!=='hero', selHelp: help[s.sel] || '',
      publish: () => this.setState({ pub: true }), pubLabel: s.pub ? 'Published' : 'Publish changes', pubBg: s.pub ? '#E3F4EA' : '#FF6A13', pubFg: s.pub ? '#0F5132' : '#0B1530'
    };
  }
}
</script>
</body>
</html>
