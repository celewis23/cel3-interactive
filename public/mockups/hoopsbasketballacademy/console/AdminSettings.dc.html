<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/mockups/hoopsbasketballacademy/console/">
<script src="/mockups/hoopsbasketballacademy/preview-chrome.js" data-section="console" defer></script>

<title>Console — Settings</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F3F6FB}
*{box-sizing:border-box}
.d{font-family:'Archivo',sans-serif;font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.88}
a{color:#00539B}a:hover{color:#012169}
.card{background:#FFFFFF;border-radius:18px;padding:22px;box-shadow:0 1px 0 #DCE3F0}
.k{font-size:11px;font-weight:800;letter-spacing:.12em;color:#4A5675}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font:700 14px 'Inter',sans-serif;text-decoration:none;border:0;cursor:pointer}
.t{width:100%;text-align:left;min-height:44px;padding:0 14px;border-radius:10px;border:0;cursor:pointer;font:700 14px 'Inter',sans-serif}
.inp{width:100%;min-height:44px;border-radius:10px;border:2px solid #DCE3F0;padding:0 12px;font:500 14px 'Inter',sans-serif}

summary::-webkit-details-marker{display:none}
summary{list-style:none}
@media (max-width: 640px){
.sp{padding-left:20px!important;padding-right:20px!important}
.sv{padding-top:64px!important;padding-bottom:64px!important}
.panel{padding:24px!important}
.mp{padding:16px!important}
.hide-m{display:none!important}
.scroll-m{flex-wrap:nowrap!important;overflow-x:auto!important}
.tabs-m{flex-direction:row!important;flex-wrap:nowrap!important;overflow-x:auto!important;padding-bottom:4px}
.tabs-m .tab{width:auto!important;white-space:nowrap;flex:none!important;min-height:52px!important}
.img-m{height:240px!important}
.navroot{min-height:0!important;padding:12px 14px!important}
}
@media (min-width: 641px){.show-m{display:none!important}}
</style>
<link rel="stylesheet" href="./responsive.css">
</helmet>
<div class="console-shell" style="font-family: 'Inter', sans-serif; color: #0B1530; background: #F3F6FB; width: 100%; min-height: 1100px; display: flex; flex-wrap: wrap">
<div class="console-sidebar" style="flex: 1 1 248px; max-width: 100%"><dc-import name="AdminNav" active="set" hint-size="100%,1100px"></dc-import></div>
<main class="mp" style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 40px">
<div class="k">ACADEMY</div><h1 class="d" style="font-size: clamp(40px, 6vw, 56px); color: #012169; margin: 8px 0 0">Settings</h1>
<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; align-items: flex-start">
<div class="card" style="flex: 1 1 220px; padding: 10px; display: flex; flex-direction: column; gap: 3px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button class="t" onClick="{{t.pick}}" style="background: {{t.bg}}; color: {{t.fg}}">{{t.t}}</button></sc-for>
</div>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{tInt}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px">
<sc-for list="{{ints}}" as="i" hint-placeholder-count="6">
<div class="card" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span class="d" style="width: 48px; height: 48px; border-radius: 12px; background: {{i.c}}; color: #FFFFFF; font-size: 24px; display: flex; align-items: center; justify-content: center">{{i.l}}</span>
<div style="flex: 1"><div style="font-weight: 800; font-size: 16px">{{i.n}}</div><div style="font-size: 13px; color: #4A5675; margin-top: 2px">{{i.d}}</div></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid #E3E9F5">
<span style="font-size: 12px; font-weight: 800; letter-spacing: .06em; color: {{i.sc}}">{{i.st}}</span>
<button class="btn" onClick="{{i.toggle}}" style="background: {{i.bbg}}; color: {{i.bfg}}; min-height: 38px">{{i.b}}</button>
</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{tApp}}" hint-placeholder-val="{{ false }}">
<div class="card" style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center">
<div style="flex: 1 1 300px">
<div class="k">CONSOLE APP</div>
<div class="d" style="font-size: 40px; color: #012169; margin-top: 8px">Installed on this device</div>
<p style="font-size: 14px; color: #4A5675; line-height: 1.6; margin: 10px 0 0">Install the console on your phone too: open this page on it and tap "Add to Home Screen", or scan the code.</p>
</div>
<div style="width: 132px; height: 132px; border-radius: 14px; background: #F3F6FB; box-shadow: inset 0 0 0 3px #012169; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #012169">INSTALL QR</div>
</div>
<div class="card">
<div class="k">PUSH NOTIFICATIONS</div>
<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 10px">
<sc-for list="{{notifs}}" as="n" hint-placeholder-count="5"><label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #E3E9F5; font-weight: 600; font-size: 14px">{{n.t}}<input type="checkbox" checked="{{n.on}}" onChange="{{n.flip}}" style="width: 22px; height: 22px; accent-color: #00539B"></label></sc-for>
</div>
</div>
<div class="card">
<div class="k">FAMILY &amp; ATHLETE APP</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px; margin-top: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">App name<input class="inp" value="Hoops"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Athletes can message Coach from age<input class="inp" value="13"></label>
</div>
</div>
</sc-if>

<sc-if value="{{tOther}}" hint-placeholder-val="{{ false }}">
<div class="card">
<div class="k">{{tabName}}</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 14px; margin-top: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Academy name<input class="inp" value="Hoops Basketball Academy"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Gym address<input class="inp" value="[GYM ADDRESS]"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Reply-to email<input class="inp" value="coach@[yourdomain].com"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700">Business phone<input class="inp" value="[PHONE]"></label>
</div>
<button class="btn" style="background: #012169; color: #FFFFFF; margin-top: 18px">Save changes</button>
</div>
</sc-if>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { tab: 'Integrations', con: { stripe: true, mail: true, gcal: false, ig: false, ga: false }, n: [true,true,true,false,true] }; }
  renderVals() {
    const s = this.state;
    const T = ['General','Programs & pricing','Integrations','App & notifications','Team & coaches','Domain & email'];
    const tabs = T.map(t => ({ t, pick: () => this.setState({ tab: t }), bg: s.tab===t ? '#012169' : 'transparent', fg: s.tab===t ? '#FFFFFF' : '#0B1530' }));
    const I = [
      ['stripe','S','Stripe','Subscriptions, checkout links, payouts','#635BFF'],
      ['mail','@','Email (your domain)','Send from coach@yourdomain.com','#00539B'],
      ['gcal','G','Google Calendar','Sync sessions and evaluations','#2E6FB0'],
      ['ig','IG','Instagram','Show your feed on the site','#B4460B'],
      ['ga','A','Google Analytics','Track site visits and requests','#33405F']
    ];
    const ints = I.map(([id,l,n,d,c]) => { const on = s.con[id]; return { l, n, d, c, st: on ? 'CONNECTED' : 'NOT CONNECTED', sc: on ? '#0F5132' : '#4A5675', b: on ? 'Manage' : 'Connect', bbg: on ? '#F3F6FB' : '#012169', bfg: on ? '#012169' : '#FFFFFF', toggle: () => this.setState({ con: { ...s.con, [id]: true } }) }; });
    const NT = ['New workout request','New message from a parent or athlete','Homework completed','Athlete checked in','Payment failed'];
    const notifs = NT.map((t,i) => ({ t, on: s.n[i], flip: () => { const n = s.n.slice(); n[i] = !n[i]; this.setState({ n }); } }));
    return { tabs, ints, notifs, tInt: s.tab==='Integrations', tApp: s.tab==='App & notifications', tOther: s.tab!=='Integrations' && s.tab!=='App & notifications', tabName: s.tab.toUpperCase() };
  }
}
</script>
</body>
</html>
