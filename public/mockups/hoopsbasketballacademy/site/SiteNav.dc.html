<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/mockups/hoopsbasketballacademy/site/">
<script src="/mockups/hoopsbasketballacademy/preview-chrome.js" data-section="site" defer></script>

<title>Site navigation</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.snav-link{color:#FFFFFF;text-decoration:none;font:600 15px 'Inter',sans-serif;padding:10px 4px}
.snav-link:hover{color:#8FB8FF}
.snav summary::-webkit-details-marker{display:none}
.snav summary{list-style:none}
@media (max-width: 760px){.snav-desk{display:none!important}}
@media (min-width: 761px){.snav-mob{display:none!important}}
</style>
<link rel="stylesheet" href="./responsive.css">
</helmet>
<header class="snav" style="background: #012169; position: relative; z-index: 30; width: 100%; font-family: 'Inter', sans-serif">
<nav aria-label="Main" style="max-width: 1280px; margin: 0 auto; padding: 18px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #FFFFFF">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="flex: none"><circle cx="20" cy="20" r="18" fill="#FF6A13"></circle><path d="M2 20h36M20 2v36M7 7c6 5 6 21 0 26M33 7c-6 5-6 21 0 26" stroke="#012169" stroke-width="2.2" fill="none"></path></svg>
<span style="display: flex; flex-direction: column"><span style="font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 900; text-transform: uppercase; font-size: 26px; line-height: .9">Hoops</span><span style="font-size: 10px; letter-spacing: .22em; font-weight: 700; color: #B7C3E0">BASKETBALL ACADEMY</span></span>
</a>
<div class="snav-desk" style="display: flex; align-items: center; gap: 24px">
<sc-for list="{{links}}" as="l" hint-placeholder-count="5">
<a class="snav-link" href="{{l.href}}" style="color: {{l.color}}; box-shadow: {{l.line}}">{{l.t}}</a>
</sc-for>
<a href="RequestWorkout.dc.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 22px; border-radius: 999px; background: {{ctaBg}}; color: {{ctaFg}}; font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap">Request a workout</a>
</div>
<button class="snav-mob site-menu-toggle" onClick="{{toggle}}" aria-expanded="{{open}}" aria-controls="site-menu">☰ Menu</button>
<button class="{{backdropCls}}" onClick="{{close}}" aria-label="Close menu backdrop" tabindex="-1"></button>
<div id="site-menu" class="{{panelCls}}" onKeyDown="{{menuKeyDown}}">
<div class="site-drawer-heading"><strong>Hoops Basketball Academy</strong><button class="site-drawer-close" onClick="{{close}}" aria-label="Close menu">✕</button></div>
<nav aria-label="Mobile navigation"><sc-for list="{{links}}" as="l" hint-placeholder-count="5">
<a href="{{l.href}}" style="display: flex; align-items: center; min-height: 48px; padding: 0 14px; border-radius: 12px; background: {{l.mBg}}; color: #012169; font-weight: 800; font-size: 17px; text-decoration: none">{{l.t}}</a>
</sc-for>
<a href="RequestWorkout.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 8px; border-radius: 999px; background: #FF6A13; color: #0B1530; font-weight: 800; text-decoration: none">Request a workout</a>
</nav></div>
</nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","legends","league","about","request","none"],"default":"home"},"$preview":{"width":1280,"height":82}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const L = [['home','Programs','Main.dc.html'],['legends','Hoops Legends','Legends.dc.html'],['league','3x3 League','League.dc.html'],['about','About','About.dc.html'],['app','App login','/mockups/hoopsbasketballacademy/app/parent']];
    const links = L.map(([id,t,href]) => ({ t, href, color: id === a ? '#FF6A13' : '#FFFFFF', line: id === a ? 'inset 0 -3px 0 #FF6A13' : 'none', mBg: id === a ? '#E3ECFA' : 'transparent' }));
    const req = a === 'request';
    const open = !!(this.state && this.state.open);
    const close = () => {
      this.setState({ open: false });
      document.querySelector('.site-menu-toggle')?.focus();
    };
    const toggle = () => {
      if (open) { close(); return; }
      this.setState({ open: true });
      setTimeout(() => document.querySelector('.site-drawer-close')?.focus(), 50);
    };
    const menuKeyDown = (event) => {
      if (!window.matchMedia('(max-width: 1000px)').matches) return;
      if (event.key === 'Escape') { event.preventDefault(); close(); }
      if (event.key === 'Tab') {
        const controls = [...document.querySelectorAll('#site-menu button, #site-menu a[href]')];
        const first = controls[0], last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
      }
    };
    return { open, toggle, close, menuKeyDown, backdropCls: open ? 'site-menu-backdrop is-open' : 'site-menu-backdrop', panelCls: open ? 'site-menu-panel is-open' : 'site-menu-panel', links, ctaBg: req ? '#FF6A13' : '#FFFFFF', ctaFg: req ? '#0B1530' : '#012169' };
  }
}
</script>
</body>
</html>
