<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0a0a0a">
  <title>Mockup directory · CEL3 Interactive</title>
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0a0a;color:#f2f2f2}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:32px 20px;background:radial-gradient(ellipse at 50% 0%,#10232d 0%,#0a0a0a 60%)}
    main{width:100%;max-width:420px}.brand{color:#9a9ca3;letter-spacing:.18em;font-size:11px;font-weight:700;text-align:center;margin-bottom:26px}.card{padding:36px 30px 26px;background:#16171b;border:1px solid #30333d;border-radius:20px;box-shadow:0 18px 70px #0005}
    .icon{width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:#38bdf815;color:#38bdf8;margin-bottom:24px}svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    h1{margin:0 0 12px;font-size:28px;letter-spacing:-.03em;line-height:1.2}.intro{font-size:15px;line-height:1.6;color:#b2b4bc;margin:0 0 26px}label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}
    input{width:100%;height:66px;border:1px solid #464b58;border-radius:10px;background:#0e0f12;color:#fff;font:28px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.5em;text-align:center;padding:12px 12px 12px 26px}
    input:focus-visible,button:focus-visible{outline:3px solid #38bdf8;outline-offset:4px}button{display:block;width:100%;margin-top:18px;border:0;border-radius:10px;background:#38bdf8;color:#062333;padding:16px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;min-height:50px}button:hover{background:#7dd3fc}button:disabled{opacity:.6;cursor:wait}
    #status{min-height:40px;margin:16px 0 0;color:#fdb9b9;font-size:13px;line-height:1.5}noscript p{font-size:13px;line-height:1.6;color:#fdb9b9}.footnote{text-align:center;font-size:12px;color:#808590;margin:22px 0 0}@media(max-width:360px){.card{padding:28px 22px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main>
    <p class="brand">CEL3 INTERACTIVE</p>
    <section class="card" aria-labelledby="title">
      <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
      <h1 id="title">Mockup directory</h1>
      <p class="intro">Enter your 4-digit access code to view the directory.</p>
      <form id="access-form">
        <label for="code">Access code</label>
        <input id="code" name="code" type="password" inputmode="numeric" autocomplete="off" minlength="4" maxlength="16" required aria-describedby="status" autofocus>
        <button id="submit" type="submit">Open directory →</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
      <noscript><p>Please enable JavaScript to enter your access code.</p></noscript>
    </section>
    <p class="footnote">Client preview links open directly.</p>
  </main>
  <script>
    const form = document.querySelector('#access-form');
    const input = document.querySelector('#code');
    const button = document.querySelector('#submit');
    const status = document.querySelector('#status');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (button.disabled) return;
      const code = input.value.replace(/\s/g, '');
      if (!/^\d{4}$/.test(code)) { status.textContent = 'Enter the 4-digit code.'; input.focus(); return; }
      button.disabled = true; button.textContent = 'Opening…'; status.textContent = '';
      try {
        const response = await fetch('/api/mockups/access', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code}), cache:'no-store'});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to open the directory. Please try again.');
        window.location.assign('/mockups');
      } catch (error) {
        status.textContent = error.message || 'Unable to connect. Please try again.';
        button.disabled = false; button.textContent = 'Open directory →'; input.focus(); input.select();
      }
    });
  </script>
</body>
</html>
